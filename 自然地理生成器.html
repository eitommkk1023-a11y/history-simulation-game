// iOS Safari では、タップ中に指がわずかに動くとボタンの click が発生しないことがある。
// そのため指を離した瞬間（touchend）を直接受け取ってボタンを動かす（20px 以内の揺れはタップ扱い）
function bindTap(el, fn) {
  let start = null, lastTouch = 0;
  el.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    start = { id: t.identifier, x: t.clientX, y: t.clientY };
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    e.preventDefault();   // 後から来る click による二重実行を防ぐ
    if (!start) return;
    let t = null;
    for (const c of e.changedTouches) if (c.identifier === start.id) t = c;
    const s0 = start; start = null;
    if (!t) return;
    lastTouch = Date.now();
    const dx = t.clientX - s0.x, dy = t.clientY - s0.y;
    if (!el.disabled && dx * dx + dy * dy <= 20 * 20) fn();
  }, { passive: false });
  el.addEventListener('touchcancel', () => { start = null; });
  // タッチ以外（外付けキーボードなど）からの操作
  el.addEventListener('click', () => { if (Date.now() - lastTouch > 800 && !el.disabled) fn(); });
}

// 暦は 1か月 30日・1年 360日（12か月）

// 地形・川のシェーダーに渡す値（世界を作り直しても同じオブジェクトを使う）
const labDummyTex = new THREE.DataTexture(new Uint8Array(4), 1, 1, THREE.RGBAFormat);
labDummyTex.needsUpdate = true;
const labU = { uSim: { value: labDummyTex }, uHand: { value: labDummyTex }, uSimOn: { value: 0 }, uFauna: { value: labDummyTex }, uFaunaOn: { value: 0 },

// 地形のマテリアルに、積雪・洪水・干上がった湖・火山灰の表示を加える
function labPatchTerrainMaterial(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uVolcanoMask = {value:volcanoMaskTexture};
    sh.uniforms.uSim = labU.uSim; sh.uniforms.uHand = labU.uHand; sh.uniforms.uSimOn = labU.uSimOn;
    sh.uniforms.uFauna = labU.uFauna; sh.uniforms.uFaunaOn = labU.uFaunaOn; sh.uniforms.uLava = labU.uLava; sh.uniforms.uLavaHeat = labU.uLavaHeat;
    sh.fragmentShader = 'uniform sampler2D uVolcanoMask;\nuniform sampler2D uSim;\nuniform sampler2D uHand;\nuniform float uSimOn;\nuniform sampler2D uFauna;\nuniform float uFaunaOn;\nuniform sampler2D uLava;\nuniform float uLavaHeat;\n' +
      sh.fragmentShader.replace('#include <map_fragment>', [
        '#include <map_fragment>',
        'if (texture2D(uVolcanoMask,vUv).r > 0.5) discard;',
        'if (uSimOn > 0.5) {',
        '  vec4 sm = texture2D(uSim, vUv);',
        '  float hv = texture2D(uHand, vUv).r * 255.0;',
        '  if (abs(hv - 127.0) > 0.5) {',                       // 127 は海
        '    if (hv > 127.0) {',
        '      float hm = (hv - 128.0) * 0.5;',                 // 近くの川・湖の水面からの高さ (m)
        '      if (hm < sm.g * 63.75 - 0.5) diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.33, 0.43, 0.50), 0.85);',
        '    } else if (hv * 0.5 < sm.a * 63.75 - 1.0) diffuseColor.rgb = vec3(0.58, 0.50, 0.40);',   // 干上がった湖底
        '    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.37, 0.35, 0.34), sm.b * 0.85);',
        '    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.94, 0.96, 1.0), smoothstep(0.08, 0.6, sm.r));',
        '  }',
        '  float lv = texture2D(uLava, vUv).r;',                    // 溶岩：噴火直後は赤く光り、冷えると黒い岩になる
        '  if (lv > 0.3) {',
        '    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.30, 0.26, 0.24), smoothstep(0.3, 0.7, lv) * (0.45 + 0.4 * uLavaHeat));',
        '    totalEmissiveRadiance += vec3(1.0, 0.35, 0.06) * uLavaHeat * smoothstep(0.3, 0.8, lv);',
        '  }',
        '}',
        'if (uFaunaOn > 0.5) {',                                   // 動物の密度（R）と、画面中央の個体群の範囲（G）
        '  vec4 fa = texture2D(uFauna, vUv);',
        '  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.59, 0.12, 0.07), fa.r * 0.8);',
        '  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.35, 0.59, 0.92), fa.g * 0.45);',
        '}',
      ].join('\n'));
  };
}

function labCell(bx, by) {
  const cx = Math.min(sim.w - 1, Math.max(0, Math.floor(bx / sim.step)));
  const cy = Math.min(sim.h - 1, Math.max(0, Math.floor(by / sim.step)));
  return cy * sim.w + cx;
}

// ---- 値ノイズ（天気の移り変わり用）
function labHash(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1440662683) ^ sim.seedHash;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function labNoise(x, y, z) {
  const x0 = Math.floor(x), y0 = Math.floor(y), z0 = Math.floor(z);
  let fx = x - x0, fy = y - y0, fz = z - z0;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const l = (a, b, t) => a + (b - a) * t;
  const c = (dz) => l(l(labHash(x0, y0, z0 + dz), labHash(x0 + 1, y0, z0 + dz), fx),
    l(labHash(x0, y0 + 1, z0 + dz), labHash(x0 + 1, y0 + 1, z0 + dz), fx), fy);
  return l(c(0), c(1), fz);
}

// ---- 世界ごとの初期化（実験パネルを初めて使うときに作る）
function labInit() {
  const cc = world.climate.cell, w = cc.gridW, h = cc.gridH, n = w * h;
  sim = {
    w, h, n, cc, step: cc.gridStep, day: 0, tOff: 0, seedHash: seedToInt(currentSeed) | 0,
    snow: new Float32Array(n), soil: new Float32Array(n).fill(50), flood: new Float32Array(n), drop: new Float32Array(n), ash: new Float32Array(n),
    runoff: new Float32Array(n), tmp: new Float32Array(n),
    T: new Float32Array(n), P: new Float32Array(n), cloud: new Float32Array(n), kind: new Uint8Array(n), storm: new Float32Array(n),
    rowU: new Float32Array(12 * h), rowV: new Float32Array(12 * h),
    events: [], plumes: [], bak: new Map(), regions: [], lavaAge: 999, lavaBig: false,
    volcActive0: (world.volcanoes || []).map(v => v.active), stats: { eruptions: 0, eruptEvents: 0, newLand: 0 },
  };
  // 溶岩（2ブロック単位）
  sim.lavaData = new Uint8Array((W / 2) * (H / 2));
  sim.lavaTex = new THREE.DataTexture(sim.lavaData, W / 2, H / 2, THREE.LuminanceFormat);
  sim.lavaTex.magFilter = sim.lavaTex.minFilter = THREE.LinearFilter; sim.lavaTex.needsUpdate = true;
  labU.uLava.value = sim.lavaTex;
  // 冬の積雪の初期値：11月・12月の降雪の8割
  for (let c = 0; c < n; c++) sim.snow[c] = cc.zone[c] ? (cc.snow[10 * n + c] + cc.snow[11 * n + c]) * 0.8 : 0;
  // 天気を運ぶ風：行ごとの平均（行の間でなめらかに）
  const raw = new Float32Array(2 * h);
  for (let m = 0; m < 12; m++) {
    for (let y = 0; y < h; y++) {
      let su = 0, sv = 0;
      for (let x = 0; x < w; x++) {
        const k = m * n + y * w + x, th = cc.windDir[k] / 256 * Math.PI * 2, sp = cc.windSpeed[k] / 10;
        su += -sp * Math.sin(th); sv += -sp * Math.cos(th);   // 吹いてくる方向の逆向きへ進む（v は北向きが正）
      }
      raw[y] = su / w; raw[h + y] = sv / w;
    }
    for (let y = 0; y < h; y++) {
      let su = 0, sv = 0, k = 0;
      for (let d = -6; d <= 6; d++) { const yy = Math.min(h - 1, Math.max(0, y + d)); su += raw[yy]; sv += raw[h + yy]; k++; }
      sim.rowU[m * h + y] = su / k; sim.rowV[m * h + y] = sv / k;
    }
  }
  sim.simData = new Uint8Array(n * 4); sim.cloudData = new Uint8Array(n * 4);
  sim.simTex = new THREE.DataTexture(sim.simData, w, h, THREE.RGBAFormat);
  sim.simTex.magFilter = sim.simTex.minFilter = THREE.LinearFilter;
  sim.cloudTex = new THREE.DataTexture(sim.cloudData, w, h, THREE.RGBAFormat);
  sim.cloudTex.magFilter = sim.cloudTex.minFilter = THREE.LinearFilter;
  sim.handTex = labBuildHand();
  const cg = new THREE.PlaneGeometry(W, H, 1, 1); cg.rotateX(-Math.PI / 2);
  sim.cloudMesh = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({ map: sim.cloudTex, transparent: true, depthWrite: false }));
  sim.cloudMesh.position.y = LAB_CLOUD_Y;
  sim.cloudMesh.renderOrder = 2;
  sim.cloudMesh.visible = lab.clouds;
  scene.add(sim.cloudMesh);
  labU.uSim.value = sim.simTex; labU.uHand.value = sim.handTex; labU.uSimOn.value = 1;
  labComputeToday();
  labUploadTextures();
}

// 近くの川・湖の水面からの高さ（洪水の広がりと、湖が干上がる範囲に使う）。2ブロック単位
// 値：127 = 海、0〜126 = 川・湖（水深 m × 2）、128〜255 = 陸（近くの水面からの高さ m × 2 + 128）
function labBuildHand() {
  const S = 2, w = W / S, h = H / S, n = w * h;
  const out = new Uint8Array(n).fill(255), surf = new Float32Array(n), dist = new Uint8Array(n).fill(255);
  const q = new Int32Array(n); let qh = 0, qt = 0;
  const { elev, type, water, lakeId, lakeLevels } = world;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const j = y * w + x, i = y * S * W + x * S;
    if (!type[i]) { out[j] = 127; continue; }
    if (!water[i]) continue;
    const L = lakeId[i];
    const level = L ? lakeLevels[L] : elev[i] + 2, depth = Math.max(0.5, level - elev[i]);
    out[j] = Math.min(126, Math.round(depth * 2)); surf[j] = level; dist[j] = 0; q[qt++] = j;
  }
  while (qh < qt) {
    const j = q[qh++], x = j % w, y = (j - x) / w, d = dist[j];
    if (d >= 40) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      const k = yy * w + xx;
      if (dist[k] !== 255 || out[k] === 127) continue;
      dist[k] = d + 1; surf[k] = surf[j]; q[qt++] = k;
      const hm = Math.max(0, elev[yy * S * W + xx * S] - surf[j]);
      out[k] = 128 + Math.min(127, Math.round(hm * 2));
    }
  }
  // テクスチャの行0は奥側にならないよう上下を反転
  const data = new Uint8Array(n);
  for (let y = 0; y < h; y++) data.set(out.subarray(y * w, y * w + w), (h - 1 - y) * w);
  const tex = new THREE.DataTexture(data, w, h, THREE.LuminanceFormat);
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

// ---- 今日の天気（気温・降水・雲）
function labComputeToday() {
  const s = sim, { w, h, n, cc } = s;
  const doy = s.day % LAB_DAYS_PER_YEAR, mf = (doy - 15) / LAB_DAYS_PER_MONTH;
  let m0 = Math.floor(mf); const t = mf - m0; m0 = (m0 + 12) % 12; const m1 = (m0 + 1) % 12;
  const o0 = m0 * n, o1 = m1 * n, z = s.day * 0.22;
  // 天候ボタンの効果（種類ごとの重み）
  const ew = {};
  for (const e of s.events) {
    const a = ew[e.kind] || (ew[e.kind] = new Float32Array(n));
    if (e.global) { a.fill(1); continue; }
    const r = e.r, x0 = Math.max(0, Math.floor(e.cx - r)), x1 = Math.min(w - 1, Math.ceil(e.cx + r));
    const y0 = Math.max(0, Math.floor(e.cy - r)), y1 = Math.min(h - 1, Math.ceil(e.cy + r));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const d = Math.sqrt((x - e.cx) * (x - e.cx) + (y - e.cy) * (y - e.cy)) / r;
      if (d >= 1) continue;
      const k = y * w + x, v = d < 0.65 ? 1 : 1 - (d - 0.65) / 0.35;
      if (v > a[k]) a[k] = v;
    }
  }
  s.storm.fill(0);
  for (const e of s.events) if (e.kind === 'storm') {
    const r = e.r, x0 = Math.max(0, Math.floor(e.cx - r)), x1 = Math.min(w - 1, Math.ceil(e.cx + r));
    const y0 = Math.max(0, Math.floor(e.cy - r)), y1 = Math.min(h - 1, Math.ceil(e.cy + r));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const d = Math.sqrt((x - e.cx) * (x - e.cx) + (y - e.cy) * (y - e.cy)) / r;
      if (d >= 1) continue;
      const ang = Math.atan2(y - e.cy, x - e.cx);
      const v = (d < 0.65 ? 1 : 1 - (d - 0.65) / 0.35) * (d < 0.07 ? 0.1 : 0.6 + 0.4 * Math.sin(ang * 2 - d * 9 + s.day * 0.8));
      const k = y * w + x;
      if (v > s.storm[k]) s.storm[k] = v;
    }
  }
  const W0 = 1 / LAB_WEATHER_SCALE;
  // 天気の模様を風で流す。緯度で風の速さが違うので、流し続けると模様が横に引き伸ばされる。
  // そこで2つの模様を周期ごとに入れ替えながら流し、ずれがたまらないようにする
  const T = LAB_FLOW_PERIOD, phA = s.day % T, phB = (s.day + T / 2) % T;
  const cycA = Math.floor(s.day / T), cycB = Math.floor((s.day + T / 2) / T) + 500;
  const wA = 1 - Math.abs(2 * phA / T - 1), kd = 86.4 / (s.step * world.geology.kmPerBlock) * 0.5, mo = m0 * h;
  for (let y = 0; y < h; y++) {
    const du = s.rowU[mo + y] * kd, dv = -s.rowV[mo + y] * kd;
    const axo = du * phA, ayo = dv * phA, bxo = du * phB, byo = dv * phB;
    for (let x = 0; x < w; x++) {
      const c = y * w + x;
      const ax = (x - axo) * W0 + cycA * 13.7, ay = (y - ayo) * W0, bx = (x - bxo) * W0 + cycB * 13.7, by = (y - byo) * W0;
      const ua = 0.65 * labNoise(ax, ay, z) + 0.35 * labNoise(ax * 2.3 + 7.3, ay * 2.3 - 3.1, z * 1.7);
      const ub = 0.65 * labNoise(bx, by, z) + 0.35 * labNoise(bx * 2.3 + 7.3, by * 2.3 - 3.1, z * 1.7);
      let u = ua * wA + ub * (1 - wA);
      const sd = Math.sqrt(wA * wA + (1 - wA) * (1 - wA));   // 混ぜると模様が薄まる分を戻す
      u = Math.min(1, Math.max(0, 0.5 + (u - 0.5) / sd * 2.8));
      const nx = x * W0, ny = y * W0;
      let T = (cc.tMean[o0 + c] + (cc.tMean[o1 + c] - cc.tMean[o0 + c]) * t) / 10 + s.tOff
        + (labNoise(nx * 0.7 + 50, ny * 0.7, z * 0.5) - 0.5) * 7;
      const Pm = cc.precip[o0 + c] + (cc.precip[o1 + c] - cc.precip[o0 + c]) * t;
      // 雨の降る日の割合（月 60mm で 3日に1日、200mm で 4日に3日）
      const f = Math.min(0.8, Math.max(0.02, 1 - Math.exp(-Pm / 150)));
      const thr = 1 - f;
      let cloud = Math.min(1, Math.max(0, (u - thr + 0.05) / 0.13));
      let P = u > thr ? Pm / LAB_DAYS_PER_MONTH / f * (0.3 + 1.4 * (u - thr) / f) : 0;
      let storm = 0;
      if (ew.clear) { const v = ew.clear[c]; P *= 1 - v; cloud *= 1 - v; }
      if (ew.drought) { const v = ew.drought[c]; P *= 1 - v; cloud *= 1 - 0.85 * v; T += 4 * v; }
      const vc = 0.55 + 0.45 * u;   // 発生させた雨雲にも濃淡をつける
      if (ew.rain) { const v = ew.rain[c]; P = Math.max(P, 14 * v * (0.5 + u)); cloud = Math.max(cloud, v * vc); }
      if (ew.heavy) { const v = ew.heavy[c]; P = Math.max(P, 75 * v * (0.5 + u)); cloud = Math.max(cloud, v * vc); }
      if (ew.snow) { const v = ew.snow[c]; T -= 16 * v; if (v > 0.5 && T > -3) T = -3; P = Math.max(P, 18 * v * (0.5 + u)); cloud = Math.max(cloud, v * vc); }
      if (ew.storm) { const v = ew.storm[c]; storm = s.storm[c]; P = Math.max(P, 120 * v * (0.4 + 0.6 * storm)); cloud = Math.max(cloud, storm); }
      s.T[c] = T; s.P[c] = P; s.cloud[c] = cloud;
      s.kind[c] = storm > 0.3 || P > 100 ? WX.STORM : P > 0.5 ? (T <= 0.5 ? WX.SNOW : WX.RAIN) : cloud > 0.35 ? WX.CLOUDY : WX.CLEAR;
    }
  }
  s.month = m0; s.mt = t;
}

// ---- 1日進める：今日の天気で積雪・土の水分・洪水・湖の水位を更新
function labStep() {
  const s = sim, { w, h, n, cc } = s;
  s.day = clock.day;
  const m = Math.floor((s.day % LAB_DAYS_PER_YEAR) / LAB_DAYS_PER_MONTH);
  // 嵐を風で流す（1 m/s で 1日 約 3.2 セル。動きすぎないよう半分に）
  const k = 86.4 / (s.step * world.geology.kmPerBlock) * 0.5;
  // 嵐は風に流されて進む
  for (const e of s.events) if (e.kind === 'storm') {
    const y = Math.min(h - 1, Math.max(0, Math.round(e.cy)));
    e.cx += s.rowU[m * h + y] * k * 0.6; e.cy -= s.rowV[m * h + y] * k * 0.6 + 0.6;
  }
  labComputeToday();
  const o0 = s.month * n, o1 = ((s.month + 1) % 12) * n;
  const dr = s.events.find(e => e.kind === 'drought');
  for (let c = 0; c < n; c++) {
    if (!cc.zone[c]) continue;
    const T = s.T[c], P = s.P[c];
    const rain = T >= 2 ? P : T <= 0 ? 0 : P * T / 2;
    s.snow[c] += P - rain;
    const melt = T > 0 ? Math.min(s.snow[c], T * 4.5 + rain * 0.12) : 0;
    s.snow[c] -= melt;
    const liquid = rain + melt;
    const petMul = dr ? 3 : 1;   // 干ばつ（マップ全体）：蒸発が増える
    const pet = Math.max(0, 0.22 * T + 0.4) * petMul;
    let soil = s.soil[c] + liquid;
    soil -= Math.min(soil, pet);
    s.runoff[c] = Math.max(0, soil - 100);
    s.soil[c] = Math.min(100, soil);
    // 湖の水位の低下：平年より乾いた日が続くと下がり、雨で戻る
    const Tm = (cc.tMean[o0 + c] + (cc.tMean[o1 + c] - cc.tMean[o0 + c]) * s.mt) / 10;
    const Pm = cc.precip[o0 + c] + (cc.precip[o1 + c] - cc.precip[o0 + c]) * s.mt;
    const normal = Math.max(0, 0.22 * Tm + 0.4) - Pm / LAB_DAYS_PER_MONTH;
    s.drop[c] = Math.min(30, Math.max(0, s.drop[c] * 0.985 + ((pet - liquid) - normal) * 0.025));
    s.ash[c] *= 0.996;
  }
  // 洪水：周りから集まる水（川に流れ込む）で水位が上がり、数日で引く
  labBlur(s.runoff, s.tmp, w, h, 3);
  for (let c = 0; c < n; c++) {
    // 普段の雨では溢れず、1日 平均 8mm を超える流出から水位が上がる
    const target = Math.min(40, Math.max(0, s.runoff[c] - 8) * 0.09);
    s.flood[c] = Math.max(s.flood[c] * 0.8, target);
  }
  // 火山の冬は 1〜2年かけて戻る
  s.tOff *= 0.996;
  for (const e of s.events) e.days--;
  s.events = s.events.filter(e => e.days > 0);
  for (const p of s.plumes) p.daysLeft--;
  s.lavaAge++;
  if (s.plumes.some(p => p.daysLeft === 0)) volcMarkersBuild();
}
// 天気を計算せずに n 日進める（月ごと・年ごとの進め方）。続いている天候・噴火・火山の冬などの日数だけ進める
function labSkipDays(n) {
  const s = sim;
  s.day = clock.day;
  for (const e of s.events) e.days -= n;
  s.events = s.events.filter(e => e.days > 0);
  for (const p of s.plumes) p.daysLeft -= n;
  s.lavaAge += n;
  const k = Math.pow(0.996, n);
  s.tOff *= k;
  for (let c = 0; c < s.n; c++) { s.ash[c] *= k; s.flood[c] = 0; }
  labComputeToday();
  volcMarkersBuild();
}
function labBlur(a, tmp, w, h, r) {
  for (let y = 0; y < h; y++) {
    let acc = 0; const row = y * w;
    for (let x = -r; x <= r; x++) acc += a[row + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = acc / (2 * r + 1);
      acc += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) {
      a[y * w + x] = acc / (2 * r + 1);
      acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
    }
  }
}

function labUploadTextures() {
  const s = sim, { w, h, n } = s, D = s.simData, C = s.cloudData;
  for (let y = 0; y < h; y++) {
    const ro = (h - 1 - y) * w;
    for (let x = 0; x < w; x++) {
      const c = y * w + x, o = (ro + x) * 4;
      D[o] = Math.min(255, s.snow[c] / 40 * 255);
      D[o + 1] = Math.min(255, s.flood[c] * 4);
      D[o + 2] = Math.min(255, s.ash[c] * 255);
      D[o + 3] = Math.min(255, s.drop[c] * 4);
      const kd = s.kind[c], cl = s.cloud[c];
      let r = 238, g = 240, b = 244;
      if (kd === WX.RAIN) { r = 150; g = 158; b = 170; }
      else if (kd === WX.SNOW) { r = 226; g = 234; b = 248; }
      else if (kd === WX.STORM) { r = 92; g = 98; b = 112; }
      else if (kd === WX.CLOUDY) { r = 210; g = 214; b = 222; }
      C[o] = r; C[o + 1] = g; C[o + 2] = b; C[o + 3] = Math.min(255, cl * cl * 185);
    }
  }
  s.simTex.needsUpdate = true; s.cloudTex.needsUpdate = true;
  requestRender();
}

// ---- 天候ボタン：画面の中央に発生させる
function labCenterBlock() { return { x: Math.round(cam.tx + W / 2), y: Math.round(cam.tz + H / 2) }; }
function labAddEvent(kind) {
  if (!labReady()) return;
  const def = LAB_EVENTS[kind];
  // 天候はマップ全体に起こす。新しい天候は前の天候と入れ替わる
  sim.events = [];
  if (kind === 'storm') {
    // 嵐：熱帯〜亜熱帯の海に、いくつもの台風を発生させる（風に流されて進む）
    const rng = mulberry32Main((seedToInt(currentSeed) ^ (sim.day * 2654435761)) >>> 0);
    const r = LAB_STORM_RADIUS / sim.step;
    for (let k = 0, tries = 0; k < LAB_STORM_COUNT && tries < 4000; tries++) {
      const c = Math.floor(rng() * sim.n), x = c % sim.w, y = (c - x) / sim.w, al = Math.abs(sim.cc.latRow[y]);
      if (sim.cc.zone[c] || al < 8 || al > 38) continue;
      if (sim.events.some(e => (e.cx - x) ** 2 + (e.cy - y) ** 2 < (r * 2) ** 2)) continue;
      sim.events.push({ kind, cx: x, cy: y, r, days: def.days }); k++;
    }
  } else sim.events.push({ kind, global: true, days: def.days });
  labMsg(`マップ全体に「${def.label}」（${def.days}日間）`);
  postEvent({ cat: 'nature', imp: 0, group: 'weather', text: `マップ全体に${def.label}（実験・${def.days}日間）` });
  if (!clock.playing) { clockStepDay(); clockAfterStep(); }
  labUploadTextures(); labUpdateHud();
}

// ---- 噴火：全ての火山が同時に噴火する
async function labErupt(big) {

function mulberry32Main(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// 地形メッシュの一部の高さを、変更した標高から作り直す
function labUpdateMeshRegion(x0, y0, x1, y1, skipNormals) {
  if (!terrainMesh) return;
  const pos = terrainMesh.geometry.attributes.position, sg = W / MESH_RES, nV = MESH_RES + 1;
  const i0 = Math.max(0, Math.floor(x0 / sg) - 1), i1 = Math.min(MESH_RES, Math.ceil(x1 / sg) + 1);
  const j0 = Math.max(0, Math.floor(y0 / sg) - 1), j1 = Math.min(MESH_RES, Math.ceil(y1 / sg) + 1);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const v = j * nV + i;
    const fx = (pos.getX(v) + W / 2) * (W - 1) / W, fy = (pos.getZ(v) + H / 2) * (H - 1) / H;
    const hgt = heightAt(world.elev, fx, fy);
    pos.setY(v, hgt); meshHeights[v] = hgt;

  pos.needsUpdate = true;

  requestRender();
}

// 噴煙：火口から立ち上り、上空で風下へ広がる粒子
let labPuffTex = null;
function labMakePlume(v, big, windTh) {
  if (!labPuffTex) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g = cv.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    labPuffTex = new THREE.CanvasTexture(cv);
  }
  const N = big ? 150 : 90;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N), alpha = new Float32Array(N);
  const geo = new THREE.BufferGeometry();

  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: labPuffTex }, uScale: { value: window.innerHeight / (2 * Math.tan(camera.fov * Math.PI / 360)) } },
    vertexShader: 'attribute float aSize; attribute float aAlpha; attribute vec3 color; varying vec3 vC; varying float vA;' +
      'uniform float uScale; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = max(3.0, aSize * uScale / -mv.z); vC = color; vA = aAlpha; gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform sampler2D uTex; varying vec3 vC; varying float vA; void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(vC, t.a * vA); }',
    transparent: true, depthWrite: false,

  const pts = new THREE.Points(geo, mat);

  const parts = [];
  for (let k = 0; k < N; k++) parts.push({ life: -1 });
  return { v, pts, parts, X, Y, Z, big, daysLeft: big ? 20 : 8, t: 0, top: (big ? 20000 : 8000) * LAND_SCALE,
    wx: -Math.sin(windTh), wz: Math.cos(windTh) };
}
function labAnimatePlume(p, dt) {
  const pos = p.pts.geometry.attributes.position.array, col = p.pts.geometry.attributes.color.array;
  const size = p.pts.geometry.attributes.aSize.array, alpha = p.pts.geometry.attributes.aAlpha.array;
  const emitting = p.daysLeft > 0;
  let alive = 0;
  p.t += dt;
  const rate = p.parts.length / 4.5;   // 1秒あたりの発生数
  let spawn = emitting ? rate * dt + (p.spawnAcc || 0) : 0;
  for (let k = 0; k < p.parts.length; k++) {
    const q = p.parts[k];
    if (q.life < 0 && spawn >= 1) {
      spawn--;
      const lava = Math.random() < 0.22;

const PRECIP_N = 2200;
let precip = null;
function labPrecipInit() {
  const rainGeo = new THREE.BufferGeometry(), snowGeo = new THREE.BufferGeometry();

function labPrecipFrame(dt) {
  if (!precip) labPrecipInit();

  precip.rain.visible = precip.snow.visible = show;
  if (!show) return false;
  const R = Math.min(1400, Math.max(50, cam.dist * 0.55)), Hh = Math.min(R * 0.45, 120), len = Hh * 0.07;
  const { rp, sp, parts } = precip;

      if (q.wait > 0) continue;

      const bx = X + W / 2, by = Z + H / 2;
      if (bx < 0 || by < 0 || bx >= W || by >= H) continue;
      const c = labCell(bx, by), P = sim.P[c];

      q.on = 1; q.snow = sim.kind[c] === WX.SNOW; q.x = X; q.z = Z;
      q.g = Math.max(0, meshHeightAtWorld(X, Z)); q.y = q.g + Hh * (0.3 + Math.random() * 0.7);
      q.v = q.snow ? Hh / 4 : Hh / 0.7;
    }
    any = true;
    q.y -= q.v * dt;
    if (q.snow) {
      q.x += (Math.random() - 0.5) * len * 0.4;
      sp[k * 3] = q.x; sp[k * 3 + 1] = q.y; sp[k * 3 + 2] = q.z;
      rp[k * 6 + 1] = rp[k * 6 + 4] = -1e5;
    } else {
      rp[k * 6] = q.x; rp[k * 6 + 1] = q.y; rp[k * 6 + 2] = q.z;
      rp[k * 6 + 3] = q.x; rp[k * 6 + 4] = q.y + len; rp[k * 6 + 5] = q.z;

}

// 進め方：日ごと（毎日の天気まで計算）／月ごと・年ごと（毎日の天気は省き、月ごとの処理だけ行う）
const CLOCK_MODES = [

  const dt = Math.min(0.1, lab.lastT ? (now - lab.lastT) / 1000 : 0);

  faunaUpdateOverlay();
  // 目印は近づいた時だけ（カメラの距離が変わったら表示を切り替える）
  const mk = (lab.features && cam.dist < FEATURE_MINOR_DIST ? 1 : 0) + (lab.features && cam.dist < FEATURE_MAJOR_DIST ? 2 : 0) + (lab.markers && cam.dist < VOLC_MARK_DIST ? 4 : 0);

  // 溶岩の冷え方（日数で赤→黒）
  const heat = Math.max(0, 1 - sim.lavaAge / (sim.lavaBig ? 40 : 25));
  if (heat !== labU.uLavaHeat.value) { labU.uLavaHeat.value = heat; changed = true; }
  if (labPrecipFrame(dt)) changed = true;
  lab.infoT = (lab.infoT || 0) + dt;
  if (lab.infoT > 0.5) { lab.infoT = 0; updateInfoMore(); }
  for (let k = sim.plumes.length - 1; k >= 0; k--) {
    const p = sim.plumes[k];

  }

}

 if(now-weatherMotionLast<66)return;weatherMotionLast=now;
 if(!showWind&&!showWaves&&!weatherGlyphs.wind&&!weatherGlyphs.waves)return;

 if(weatherCanvas.width!==w||weatherCanvas.height!==h){weatherCanvas.width=w;weatherCanvas.height=h;}

 if(!world||(!showWind&&!showWaves))return;

 }

          for(let oy=-1;oy<=0;oy++)for(let ox=-1;ox<=0;ox++){const px=gx+ox,py=gy+oy;if(px<0||py<0||px>=N||py>=H*refinement)continue;const q=next.get(py*N+px);total+=q?q.z:volcanoBaseHeight((px+.5)*step,(py+.5)*step);count++;}
          let height=total/Math.max(1,count);
          // Blend the external patch border into the unchanged overview mesh.
          const edgeX=Math.abs(vx-Math.round(vx))<1e-8,edgeY=Math.abs(vy-Math.round(vy))<1e-8;
          const hasBase=(xx,yy)=>xx>=0&&yy>=0&&xx<W&&yy<H&&patches.get(Math.floor(yy/4)*Math.ceil(W/4)+Math.floor(xx/4))?.has(yy*W+xx);
          let border=(edgeX&&(!hasBase(Math.round(vx)-1,Math.floor(y))||!hasBase(Math.round(vx),Math.floor(y))))||(edgeY&&(!hasBase(Math.floor(x),Math.round(vy)-1)||!hasBase(Math.floor(x),Math.round(vy))));
          const X=toWorldX(vx),Z=toWorldZ(vy),Y=border?meshHeightAtWorld(X,Z):elevationToDisplay(height,verticalExaggeration,world.geology.kmPerBlock*1000);
          positions.push(X,Y,Z);colors.push(...color);
        }
        indices.push(k,k+1,k+2,k,k+2,k+3);
      }
    }
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();
    const mat=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(geo,mat);scene.add(mesh);volcanoPatchMap.set(tile,{mesh,cells});
  }
  volcanoMeshes=Array.from(volcanoPatchMap.values(),p=>p.mesh);volcanoMaskTexture.needsUpdate=true;
}

function updateVolcanoSky() {
  let haze=0;
  for(const p of volcanoSky){const dx=cam.tx+W/2-p.x,dy=cam.tz+H/2-p.y;haze+=p.strength/(1+(dx*dx+dy*dy)/(300*300));}
  haze=Math.min(.8,haze);
  const color=new THREE.Color(0x0a121d).lerp(new THREE.Color(0x36322f),haze);
  renderer.setClearColor(color);scene.fog.color.copy(color);scene.fog.near=5400*(1-haze*.7);scene.fog.far=12600*(1-haze*.65);sun.intensity=.55*(1-haze*.8);
}
function openVolcano(id) {
  if(!world || !world.volcanoes[id])return;
  volcanoSelected=id;document.getElementById('volcanoPanel').classList.add('show');refreshVolcanoPanel();
}
function refreshVolcanoPanel() {
  if(volcanoSelected<0 || !world)return;
  const v=world.volcanoes[volcanoSelected];if(!v)return;
  const e=names.byKey.get('volcano:'+volcanoSelected);
  document.getElementById('volcanoTitle').textContent=e?nameOf(e):'火山 '+volcanoSelected;
  document.getElementById('volcanoInfo').textContent=volcanoType(v)+' / '+(v.active?'活動中':'休止中')+'\n'+(COMPOSITION_LABELS[v.composition]||'')+' / '+Math.round(v.temperature||0)+'℃\nマグマ '+((v.magmaVolume||0)/1e9).toFixed(3)+' km³ / 圧力 '+Math.round((v.pressure||0)*100)+'%';
  for(const b of document.querySelectorAll('#volcanoPanel [data-level]'))b.disabled=!v.active||!volcanoReady()||!!v.eruption;
  document.getElementById('volcanoStatus').textContent=!v.active?'活動が再開するまで噴火操作はできません':volcanoFault?'計算エラー':!volcanoReady()?'計算中…':'噴火規模を選んでください';
}
async function eruptVolcano(id,level) {
  if(!volcanoReady())return {ok:false,reason:'計算中です'};
  try {const result=await volcanoCall('erupt',{id,level});
    if(!result.ok){document.getElementById('volcanoStatus').textContent=result.reason||'噴火できません';return result;}
    const v=world.volcanoes[id];labReady();const cc=world.climate.cell,c=labCell(v.x,v.y),m=clockMonth(),th=cc.windDir[m*cc.n+c]/256*Math.PI*2;
    sim.plumes.push(labMakePlume(v,level>=3,th));
    document.getElementById('volcanoStatus').textContent='噴火を開始しました。時間を進めると溶岩が流れます。';requestRender();return result;
  }catch(e){menuMsg(e.message);return {ok:false,reason:e.message};}
}
function volcanoAtScreen(x,y) {
  if(!world)return -1;let chosen=-1,distance=28*28;const point=new THREE.Vector3();
  world.volcanoes.forEach((v,i)=>{const X=toWorldX(v.x),Z=toWorldZ(v.y);point.set(X,Math.max(0,meshHeightAtWorld(X,Z))+2,Z).project(camera);if(point.z>1||point.z< -1)return;
    const dx=(point.x+1)*innerWidth/2-x,dy=(1-point.y)*innerHeight/2-y,d=dx*dx+dy*dy;if(d<distance){distance=d;chosen=i;}});return chosen;
}
function setupVolcanoControls() {
  bindTap(document.getElementById('volcanoClose'),()=>document.getElementById('volcanoPanel').classList.remove('show'));
  for(const button of document.querySelectorAll('#volcanoPanel [data-level]'))bindTap(button,()=>eruptVolcano(volcanoSelected,Number(button.dataset.level)));
  bindTap(document.getElementById('volcanoRename'),()=>{const e=names.byKey.get('volcano:'+volcanoSelected);if(e)renameOpen(e);});
  let mouse=null;
  canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;mouse={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,at:performance.now(),button:e.button};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!mouse||e.pointerType==='touch')return;const dx=e.clientX-mouse.x,dy=e.clientY-mouse.y;mouse.x=e.clientX;mouse.y=e.clientY;
    if(mouse.button===2||e.shiftKey){cam.yaw-=dx*.006;cam.pitch+=dy*.005;}else{const k=cam.dist*1.25/innerHeight,sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);cam.tx+=(-dx*cy-dy*sy)*k;cam.tz+=(dx*sy-dy*cy)*k;}updateCamera();});
  canvas.addEventListener('pointerup',e=>{if(!mouse||e.pointerType==='touch')return;const m=mouse;mouse=null;if(Math.hypot(e.clientX-m.startX,e.clientY-m.startY)>8)return;
    if(performance.now()-m.at>=LABEL_HOLD_MS){if(!labelTap(e.clientX,e.clientY)){const i=volcanoAtScreen(e.clientX,e.clientY);if(i>=0)renameOpen(names.byKey.get('volcano:'+i));}}
    else{const i=volcanoAtScreen(e.clientX,e.clientY);if(i>=0)openVolcano(i);}});
  canvas.addEventListener('pointercancel',()=>{mouse=null;});
  canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=Math.exp(Math.max(-200,Math.min(200,e.deltaY))*.001);updateCamera();},{passive:false});
}

// Snapshot is a barrier in the same worker queue as advances and eruptions.
let volcanoSaveQueue = Promise.resolve();
function serializeState() {
  const capture = async () => {
    if(!world || busy || !volcanoWorker)throw new Error('世界の準備が終わるまで保存できません');
    const instance=volcanoWorker, wasPlaying=clock.playing; clock.playing=false;
    try {
      const physical=await volcanoCall('snapshot');
      if(instance!==volcanoWorker)throw new Error('保存中に世界が切り替わりました');
      const state=serializeBaseState();state.volcano=physical;
      return typeof structuredClone==='function'?structuredClone(state):unpackTyped(packTyped(state));
    } finally {if(instance===volcanoWorker && !busy && !volcanoFault)clock.playing=wasPlaying;timebarUpdate();}
  };
  const result=volcanoSaveQueue.then(capture);volcanoSaveQueue=result.catch(()=>{});return result;
}
