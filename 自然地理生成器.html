        if (type[i]) { land++; if (elev[i] > mx) mx = elev[i]; }
      }
      const c = cy * CLW + cx;
      landFrac[c] = land / (S * S); elevMean[c] = sum / (S * S); elevMax[c] = mx;
    }
  }
  const cin = { w: CLW, h: CLH, n: CLN, step: S, kmPerCell: KM_PER_BLOCK * S, seed, latRow, landFrac, elev: elevMean, elevMax };
  const cl = generateClimateSystem(cin, progress);

  // ---- 河川・湖の処理に渡す粗いグリッド（年降水量と、海面高度に換算した年平均気温）
  const tAnnF = new Float32Array(CLN), pAnnF = new Float32Array(CLN), tHotF = new Float32Array(CLN);
  for (let c = 0; c < CLN; c++) { tAnnF[c] = cl.tAnnual[c] / 10; pAnnF[c] = cl.pAnnual[c]; tHotF[c] = cl.tHot[c] / 10; }
  const tempSea = lowResGrid((x, y) => sampleClimate(tAnnF, 0, x, y) + 0.0065 * Math.max(0, sampleClimate(elevMean, 0, x, y)));
  const precip = lowResGrid((x, y) => sampleClimate(pAnnF, 0, x, y));

  // ---- 全解像度の植生：気候区分を基本に、その場所の標高で気温を補正する
  progress('植生');
  const biome = new Uint8Array(N);
  let sstMin = new Float32Array(CLN).fill(1e9);
  for (let m = 0; m < 12; m++) for (let c = 0; c < CLN; c++) { const v = cl.sst[m * CLN + c] / 10; if (v < sstMin[c]) sstMin[c] = v; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, c = Math.min(CLH - 1, (y / S) | 0) * CLW + Math.min(CLW - 1, (x / S) | 0);
    if (!type[i]) { biome[i] = sstMin[c] < -1.5 ? BIOME.SEA_ICE : BIOME.OCEAN; continue; }
    const e = Math.max(0, elev[i]);
    const dT = -0.0065 * (e - Math.max(0, elevMean[c]));   // セル平均の標高との差による気温の補正
    const Tann = sampleClimate(tAnnF, 0, x, y) + dT, Thot = tHotF[c] + dT, Pann = sampleClimate(pAnnF, 0, x, y);
    let zone = cl.zoneAll[c];
    // 局地的に高い山は高山、寒い場所はツンドラ・氷雪
    if (e >= CLM_ALPINE_ELEV || (e >= CLM_ALPINE_ELEV_COLD && Thot < 10)) zone = Thot < 0 ? KOPPEN.EF : KOPPEN.H;
    else if (Thot < 0) zone = KOPPEN.EF;
    else if (Thot < 10 && zone !== KOPPEN.H) zone = KOPPEN.ET;
    biome[i] = clmBiome(zone, Tann, Pann, Thot, e);
  }
  delete cl.zoneAll; delete cl.tHot;
  return { biome, tempSea, precip, data: cl };
}

// ================================================================ 7. 河川・湖
// 1. 2ブロック四方の格子で窪地埋め（Priority-Flood）を行い、すべての陸から海までの流路を決める
//    埋められた窪地のうち十分に広く深いものが湖になる（湖からあふれた水はそのまま川として流れ出る）
// 2. 降水量から流量を集計し、一定以上の流量を持つ流路を河川とする（本流＝海に注ぐ水系）
// 3. 川に沿って谷を削る。川底は下流ほど必ず低い。高緯度の山がちな海岸ではフィヨルド、大河の河口は三角江になる
const HR = 2;                          // 水文計算の格子間隔（ブロック）
const CW = W / HR, CH = H / HR, CN = CW * CH;
const RIVER_MIN_FLOW = 900;            // 河川とみなす最小流量（格子数×流出量）
const LAKE_MIN_CELLS = 30;             // 湖とみなす最小面積（ブロック）
const LAKE_MIN_DEPTH = 6;              // 湖とみなす最小水深（m）
const LAKE_SMALL_CELLS = 800;          // これ未満の小さな湖は寒冷地（氷河湖）でのみ残す
const LAKE_WATER_BALANCE = 12;          // 流入量 ÷ 湖面からの蒸発量 がこれ未満なら干上がる
const SALT_LAKE_BALANCE = 2;
const SALT_MIN_BLOCKS = 3500;           // 塩湖・塩の平原になる窪地の広さの下限（ブロック）
const SALT_MAX = 8;                     // 塩湖・塩の平原それぞれの数の上限            // 乾燥地の窪地：これ以上なら縮んだ塩湖、未満なら塩の平原
const RIA_MAX_LAT = 50;                 // リアス海岸ができる緯度の上限（これより北はフィヨルド）
const CANYON = { minElev: 650, maxP: 600, maxDepth: 1500, count: 2 };   // count：乾いた高地を流れる川のうち、峡谷にする本数   // 大峡谷：乾いた高い台地を川が深く刻む
const GORGE = { minElev: 900, depth: 450 };                   // 渓谷：雨の多い山地を川が刻む
const WATERFALL_DROP = 70;              // 川底がこれ以上急に下がる所を滝とする（m）

// 窪地埋め用の二分ヒープ（同じ高さでは先に入れたものを先に出す）
function makeHeap(cap) {
  const idx = new Int32Array(cap), key = new Float32Array(cap), seq = new Uint32Array(cap);
  let n = 0, counter = 0;
  function less(a, b) { return key[a] < key[b] || (key[a] === key[b] && seq[a] < seq[b]); }
  function swap(a, b) {
    let t = idx[a]; idx[a] = idx[b]; idx[b] = t;
    const k = key[a]; key[a] = key[b]; key[b] = k;
    t = seq[a]; seq[a] = seq[b]; seq[b] = t;
  }
  return {
    get size() { return n; },
    push(i, k) {
      let c = n++;
      idx[c] = i; key[c] = k; seq[c] = counter++;
      while (c > 0) { const p = (c - 1) >> 1; if (!less(c, p)) break; swap(c, p); c = p; }
    },
    pop() {
      const top = idx[0];
      n--;
      if (n > 0) {
        idx[0] = idx[n]; key[0] = key[n]; seq[0] = seq[n];
        let c = 0;
        for (;;) {
          const l = 2 * c + 1, r = l + 1;
          let m = c;
          if (l < n && less(l, m)) m = l;
          if (r < n && less(r, m)) m = r;
          if (m === c) break;
          swap(c, m); c = m;
        }
      }
      return top;
    },
  };
}

// Chaikin法で折れ線をなめらかにする（端点は固定）
function chaikin(pts) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], b = pts[k + 1];
    out.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25, f: a.f * 0.75 + b.f * 0.25 });
    out.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75, f: a.f * 0.25 + b.f * 0.75 });
  }
  out.push(pts[pts.length - 1]);
  return out;
}
// 一定間隔で点を打ち直す
function resample(pts, step) {
  if (pts.length < 2) return pts;
  const out = [pts[0]];
  let carry = 0;
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], b = pts[k + 1];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy);
    let t = step - carry;
    while (t <= len) {
      const u = t / len;
      out.push({ x: a.x + dx * u, y: a.y + dy * u, f: a.f + (b.f - a.f) * u });
      t += step;
    }
    carry = len - (t - step);
  }
  const last = pts[pts.length - 1], prev = out[out.length - 1];
  if (prev.x !== last.x || prev.y !== last.y) out.push(last);
  return out;
}

function generateHydrology(seed, type, regionId, elev, biome, climate, progress) {
  progress('河川と湖');
  const rng = subRng(seed, 'rivers');
  const meanderN = makeNoise(rng);
  const N8X = [-1, 0, 1, -1, 1, -1, 0, 1], N8Y = [-1, -1, -1, 0, 0, 1, 1, 1];

  // ---- 粗い格子の標高と海
  const ch = new Float32Array(CN), cOcean = new Uint8Array(CN), runoff = new Float32Array(CN);
  for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) {
    const c = cy * CW + cx, i = cy * HR * W + cx * HR;
    let sum = 0, land = 0;
    for (let dy = 0; dy < HR; dy++) for (let dx = 0; dx < HR; dx++) {
      const j = i + dy * W + dx;
      if (type[j]) { sum += elev[j]; land++; }
    }
    if (land === 0) { cOcean[c] = 1; continue; }
    ch[c] = sum / land;
    // 流出量：降水量から蒸発分を引いたもの（砂漠ではほぼ0）
    const P = sampleLow(climate.precip, cx * HR, cy * HR);
    runoff[c] = Math.max(0, P - 300) / 1000 + 0.03;
  }

  // ---- 窪地埋め：海岸から内陸へ、低い順に広げていく
  const fill = new Float32Array(CN), rec = new Int32Array(CN).fill(-1), order = new Int32Array(CN);
  const closed = new Uint8Array(CN), mouth = new Uint8Array(CN);
  const heap = makeHeap(CN);
  for (let c = 0; c < CN; c++) {
    if (cOcean[c]) { closed[c] = 1; continue; }
    const cx = c % CW, cy = (c - cx) / CW;
    for (let k = 0; k < 8; k++) {
      const nx = cx + N8X[k], ny = cy + N8Y[k];
      if (nx < 0 || ny < 0 || nx >= CW || ny >= CH) continue;
      if (cOcean[ny * CW + nx]) { mouth[c] = 1; break; }
    }
    if (mouth[c]) { closed[c] = 1; fill[c] = ch[c]; heap.push(c, ch[c]); }
  }
  let nOrder = 0;
  while (heap.size > 0) {
    const c = heap.pop();
    order[nOrder++] = c;
    const cx = c % CW, cy = (c - cx) / CW;
    for (let k = 0; k < 8; k++) {
      const nx = cx + N8X[k], ny = cy + N8Y[k];
      if (nx < 0 || ny < 0 || nx >= CW || ny >= CH) continue;
      const n = ny * CW + nx;
      if (closed[n]) continue;
      closed[n] = 1;
      fill[n] = ch[n] > fill[c] ? ch[n] : fill[c];
      rec[n] = c;
      heap.push(n, fill[n]);
    }
  }

  // ---- 流量の集計（上流から下流へ）
  const acc = new Float32Array(CN);
  for (let k = nOrder - 1; k >= 0; k--) {
    const c = order[k];
    acc[c] += runoff[c];
    if (rec[c] >= 0) acc[rec[c]] += acc[c];
  }

  // ---- 湖：埋められた窪地のうち、十分な広さと深さのもの
  const lakeMask = new Uint8Array(CN);
  for (let c = 0; c < CN; c++) if (!cOcean[c] && fill[c] - ch[c] > 0.5) lakeMask[c] = 1;
  const cLake = new Int32Array(CN);
  const lakeLevelC = [0], lakeSaltC = [0];
  const saltFlatC = new Uint8Array(CN);
  let saltLakes = 0, saltFlats = 0;
  {
    const queue = new Int32Array(CN);
    const seen = new Uint8Array(CN);   // 調べ終えた窪地（湖にしなかったものも含む）
    let nl = 0;
    for (let s = 0; s < CN; s++) {
      if (!lakeMask[s] || seen[s]) continue;
      // 連結した窪地をまとめる
      let head = 0, tail = 0, maxDepth = 0, level = 0, maxAcc = 0, bottom = 1e9;
      queue[tail++] = s; seen[s] = 1;
      while (head < tail) {
        const c = queue[head++];
        const d = fill[c] - ch[c];
        if (d > maxDepth) maxDepth = d;
        if (fill[c] > level) level = fill[c];
        if (ch[c] < bottom) bottom = ch[c];
        if (acc[c] > maxAcc) maxAcc = acc[c];
        const cx = c % CW, cy = (c - cx) / CW;
        if (cx > 0 && lakeMask[c - 1] && !seen[c - 1]) { seen[c - 1] = 1; queue[tail++] = c - 1; }
        if (cx < CW - 1 && lakeMask[c + 1] && !seen[c + 1]) { seen[c + 1] = 1; queue[tail++] = c + 1; }
        if (cy > 0 && lakeMask[c - CW] && !seen[c - CW]) { seen[c - CW] = 1; queue[tail++] = c - CW; }
        if (cy < CH - 1 && lakeMask[c + CW] && !seen[c + CW]) { seen[c + CW] = 1; queue[tail++] = c + CW; }
      }
      // 水収支：流れ込む水（集水域の流出量）が湖面からの蒸発を十分に上回る窪地だけが湖になる
      const cs = queue[0], csx = cs % CW, csy = (cs - csx) / CW;
      const T = sampleLow(climate.tempSea, csx * HR, csy * HR) - 0.0065 * level;
      const evap = clamp(0.25 + 0.045 * T, 0.1, 1.5);
      const balance = maxAcc / (tail * evap);
      const blocks = tail * HR * HR;
      const keep = blocks >= LAKE_MIN_CELLS && maxDepth >= LAKE_MIN_DEPTH && balance >= LAKE_WATER_BALANCE &&
        (blocks >= LAKE_SMALL_CELLS || (T < 2 && balance >= LAKE_WATER_BALANCE * 3));
      const id = keep ? ++nl : 0;
      if (keep) { lakeLevelC.push(level); lakeSaltC.push(0); }
      for (let k = 0; k < tail; k++) cLake[queue[k]] = id;
      // 乾燥地の閉じた窪地：流れ込む水が少なく、湖が縮んで塩湖に、さらに乾くと塩の平原になる（流れ出る川は無い）
      if (!keep && blocks >= SALT_MIN_BLOCKS && maxDepth >= LAKE_MIN_DEPTH && T > 4) {
        if (balance >= SALT_LAKE_BALANCE && saltLakes < SALT_MAX) {
          saltLakes++;
          const lv = bottom + (level - bottom) * clamp(balance / LAKE_WATER_BALANCE, 0.25, 0.7);
          const sid = ++nl; lakeLevelC.push(lv); lakeSaltC.push(1);
          for (let k = 0; k < tail; k++) if (ch[queue[k]] < lv) cLake[queue[k]] = sid;
        } else if (balance < SALT_LAKE_BALANCE && saltFlats < SALT_MAX) {
          saltFlats++;
          const lv = bottom + (level - bottom) * 0.35;
          for (let k = 0; k < tail; k++) if (ch[queue[k]] < lv) saltFlatC[queue[k]] = 1;
        }
      }
    }
  }

  // ---- 河川の流路：河口から上流へたどり、最も流量の多い支流を本流として伸ばす
  const isRiver = new Uint8Array(CN);
  for (let c = 0; c < CN; c++) if (!cOcean[c] && acc[c] >= RIVER_MIN_FLOW) isRiver[c] = 1;
  // 各セルへ流れ込む河川セルの一覧
  const childStart = new Int32Array(CN + 1), childList = new Int32Array(CN);
  for (let c = 0; c < CN; c++) if (isRiver[c] && rec[c] >= 0) childStart[rec[c] + 1]++;
  for (let c = 0; c < CN; c++) childStart[c + 1] += childStart[c];
  {
    const fillPos = childStart.slice(0, CN);
    for (let c = 0; c < CN; c++) if (isRiver[c] && rec[c] >= 0) childList[fillPos[rec[c]]++] = c;
  }
  const toPt = (c) => { const cx = c % CW, cy = (c - cx) / CW; return { x: cx * HR + HR / 2 - 0.5, y: cy * HR + HR / 2 - 0.5, f: acc[c] }; };
  const rawLines = [];   // { pts, mouth: 河口から始まる本流か }
  let mainRivers = 0;
  const stack = [];
  for (let c = 0; c < CN; c++) if (mouth[c] && isRiver[c]) { stack.push({ c, junction: null, fromMouth: true }); mainRivers++; }
  while (stack.length) {
    const { c: start, junction, fromMouth } = stack.pop();
    let line = junction ? [junction] : [];
    let c = start, isMouthLine = fromMouth;
    for (;;) {
      if (cLake[c]) {
        // 湖の中は描かない（湖を出たところで新しい線を始める）
        if (line.length > 1) rawLines.push({ pts: line, mouth: isMouthLine });
        line = []; isMouthLine = false;
      } else {
        line.push(toPt(c));
      }
      let best = -1, bestAcc = -1;
      for (let k = childStart[c]; k < childStart[c + 1]; k++) {
        const ch2 = childList[k];
        if (acc[ch2] > bestAcc) { bestAcc = acc[ch2]; best = ch2; }
      }
      for (let k = childStart[c]; k < childStart[c + 1]; k++) {
        const ch2 = childList[k];
        if (ch2 !== best) stack.push({ c: ch2, junction: cLake[c] ? null : toPt(c), fromMouth: false });
      }
      if (best < 0) break;
      c = best;
    }
    if (line.length > 1) rawLines.push({ pts: line, mouth: isMouthLine });
  }

  // ---- 折れ線をなめらかにし、平野では少し蛇行させる
  const lines = [];
  for (const L of rawLines) {
    let pts = resample(chaikin(chaikin(L.pts)), 1.5);
    let s = 0;
    for (let k = 1; k < pts.length - 1; k++) {
      const a = pts[k - 1], b = pts[k + 1];
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
      s += 1.5;
      const amp = Math.min(4, 0.8 + 0.5 * Math.sqrt(pts[k].f / RIVER_MIN_FLOW));
      const off = amp * meanderN(pts[k].x * 0.02, pts[k].y * 0.02);
      pts[k] = { x: pts[k].x - dy / len * off, y: pts[k].y + dx / len * off, f: pts[k].f };
    }
    lines.push({ pts, mouth: L.mouth });
  }

  // ---- 谷を削る
  const widthOf = (f) => clamp(0.75 * Math.sqrt(f / RIVER_MIN_FLOW), 1.2, 9);
  const depthOf = (f) => clamp(6 + 9 * Math.log(f / RIVER_MIN_FLOW + 1), 6, 70);
  const elevAt = (x, y) => elev[clamp(Math.round(y), 0, H - 1) * W + clamp(Math.round(x), 0, W - 1)];
  let fjords = 0, estuaries = 0, deltas = 0, rias = 0, canyons = 0, gorges = 0;
  const deltaList = [], landmarks = [];
  // 大峡谷にする川：乾いた高い土地を長く流れる川（上位 CANYON.count 本）
  const canyonLine = new Uint8Array(lines.length);
  {
    const score = lines.map((L, li) => {
      let c = 0;
      for (let k = 0; k < L.pts.length; k += 2) {
        const p = L.pts[k];
        if (p.f < RIVER_MIN_FLOW * 2) continue;
        const e = elevAt(p.x, p.y), Pk = sampleLow(climate.precip, p.x, p.y);
        if (e > 450 && Pk < 750) c += (e - 450) / 500 * (750 - Pk) / 300;
      }
      return [c, li];
    }).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    for (let j = 0; j < Math.min(CANYON.count, score.length); j++) if (score[j][0] > 1.5) canyonLine[score[j][1]] = 1;
  }
  for (let li = 0; li < lines.length; li++) {
    const L = lines[li];
    const P = L.pts, n = P.length;
    // 川底：上流から下流へ向かって単調に低くなる（P[0] が下流側）
    const bed = new Float32Array(n), rad = new Float32Array(n), steep = new Float32Array(n);
    let b = Infinity, canyonRun = 0, gorgeRun = 0, cMid = -1, gMid = -1;
    for (let k = n - 1; k >= 0; k--) {
      const e = elevAt(P[k].x, P[k].y);
      let extra = 0;
      if (P[k].f > RIVER_MIN_FLOW * 2) {
        const Pk = sampleLow(climate.precip, P[k].x, P[k].y);
        // 大峡谷：乾いた高い台地を、大きな川が深く切り込む（壁の切り立った谷）
        const cw = canyonLine[li] ? smoothstep(400, 800, e) * smoothstep(800, 500, Pk)
          : smoothstep(CANYON.minElev, CANYON.minElev + 500, e) * smoothstep(CANYON.maxP, CANYON.maxP - 200, Pk);
        // 渓谷：雨の多い山地を川が深く刻む
        const gw = smoothstep(GORGE.minElev, GORGE.minElev + 500, e) * smoothstep(600, 1000, Pk);
        extra = Math.max(Math.min(CANYON.maxDepth, (e - 400) * 0.7) * cw, GORGE.depth * gw);
        steep[k] = Math.max(cw, gw * 0.7);
        if (cw > 0.4) { if (++canyonRun === 7 && cMid < 0) cMid = k; } else canyonRun = 0;
        if (gw > 0.4) { if (++gorgeRun === 7 && gMid < 0) gMid = k; } else gorgeRun = 0;
      }
      b = Math.min(b, e - depthOf(P[k].f) - extra);
      bed[k] = Math.max(b, 0.5);
      rad[k] = widthOf(P[k].f) * 1.6 + 5 + depthOf(P[k].f) * 0.12 + extra * 0.004;
    }
    if (cMid >= 0) { canyons++; landmarks.push({ kind: 'canyon', x: Math.round(P[cMid].x), y: Math.round(P[cMid].y) }); }
    if (gMid >= 0) { gorges++; landmarks.push({ kind: 'gorge', x: Math.round(P[gMid].x), y: Math.round(P[gMid].y) }); }
    // 滝：川底が短い距離で大きく下がる所（台地の縁・断層崖など）
    for (let k = 1; k < n; k++) {
      if (bed[k] - bed[k - 1] < WATERFALL_DROP || bed[k - 1] < 5) continue;
      const x = Math.round(P[k].x), y = Math.round(P[k].y);
      if (!landmarks.some(o => o.kind === 'waterfall' && (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y) < 40 * 40))
        landmarks.push({ kind: 'waterfall', x, y, drop: Math.round(bed[k] - bed[k - 1]) });
    }
    if (L.mouth) {
      const lat = latAt(P[0].y);
      let relief = 0;
      for (let k = 0; k < Math.min(n, 40); k++) relief = Math.max(relief, elevAt(P[k].x, P[k].y));
      if (lat > 52 && relief > 350 && rng() < 0.85) {
        // フィヨルド：氷河が削った深い谷に海が入り込む
        const Lf = Math.min(n - 1, Math.round((30 + rng() * 70) * (0.6 + 0.6 * smoothstep(52, 68, lat))));
        const depth = 120 + rng() * 200;
        for (let k = 0; k <= Lf; k++) {
          const t = k / Math.max(1, Lf);
          bed[k] = Math.min(bed[k], -depth * (1 - t) - 1);
          rad[k] = Math.max(rad[k], 4 + 3 * (1 - t));
        }
        fjords++;
        landmarks.push({ kind: 'fjord', x: Math.round(P[0].x), y: Math.round(P[0].y) });
      } else if (lat <= RIA_MAX_LAT && relief > 450 && rng() < 0.55) {
        // リアス海岸：山がちな海岸の川の谷が沈み、細長い入江が並ぶ
        const Lr = Math.min(n - 1, Math.round(14 + rng() * 22));
        const depth = 25 + rng() * 60;
        for (let k = 0; k <= Lr; k++) {
          const t = k / Math.max(1, Lr);
          bed[k] = Math.min(bed[k], -depth * (1 - t) - 1);
          rad[k] = Math.max(rad[k], 3.5 + 2.5 * (1 - t));
        }
        rias++;
        landmarks.push({ kind: 'ria', x: Math.round(P[0].x), y: Math.round(P[0].y) });
      } else if (P[0].f > RIVER_MIN_FLOW * 12 && rng() < 0.6 && n > 3) {
        // 三角州：大河が運んだ土砂が河口に堆積して陸地を広げる（あとで海側に扇状に積もらせる）
        const dx = P[0].x - P[3].x, dy = P[0].y - P[3].y, dl = Math.sqrt(dx * dx + dy * dy) || 1;
        deltaList.push({ x: P[0].x, y: P[0].y, dx: dx / dl, dy: dy / dl, f: P[0].f });
      } else if (P[0].f > RIVER_MIN_FLOW * 25) {
        // 三角江：大河の河口がラッパ状に開いた入江
        const Le = Math.min(n - 1, Math.round(12 + rng() * 25));
        for (let k = 0; k <= Le; k++) {
          const t = k / Math.max(1, Le);
          bed[k] = Math.min(bed[k], -6 * (1 - t) - 0.5);
          rad[k] = Math.max(rad[k], widthOf(P[k].f) * (1 + 2.5 * (1 - t)) + 3);
        }
        estuaries++;
      }
    }
    for (let k = 0; k < n; k++) {
      const px = P[k].x, py = P[k].y, bk = bed[k];
      // 氷河侵食：寒冷な谷は氷河に削られ、底が平らで壁の急なU字谷になる（川の谷はV字）
      const Tk = sampleLow(climate.tempSea, px, py) - 0.0065 * Math.max(0, elevAt(px, py));
      const glacial = smoothstep(2, -5, Tk);
      const R = rad[k] * (1 + 0.8 * glacial), R2 = R * R;
      for (let y = Math.max(0, Math.floor(py - R)); y <= Math.min(H - 1, Math.ceil(py + R)); y++) {
        const dy = y - py;
        for (let x = Math.max(0, Math.floor(px - R)); x <= Math.min(W - 1, Math.ceil(px + R)); x++) {
          const dx = x - px, d2 = dx * dx + dy * dy;
          if (d2 >= R2) continue;
          const i = y * W + x;
          if (!type[i]) continue;
          const e = elev[i];
          if (e <= bk) continue;
          const t = d2 / R2;   // 谷の断面：中心が川底、外側ほど元の地形に戻る
          // 峡谷は底が狭く壁が切り立つ（外側まで深いまま）
          const tc = steep[k] > 0 ? t + (smoothstep(0.15, 0.75, Math.sqrt(t)) - t) * steep[k] : t;
          const ne = bk + (e - bk) * (tc + (tc * tc * tc - tc) * glacial);
          if (ne < e) elev[i] = ne;
        }
      }
    }
  }
  // 海面下まで削られた所（フィヨルド・三角江）は海にする
  let drowned = 0;
  for (let i = 0; i < N; i++) {
    if (type[i] && elev[i] < 0) { type[i] = 0; regionId[i] = 0; biome[i] = BIOME.OCEAN; drowned++; }
    else if (type[i] && elev[i] < 0.5) elev[i] = 0.5;
  }

  // ---- 三角州：河口の海側へ扇状に土砂を積もらせる
  for (const d of deltaList) {
    const Ld = 14 + 22 * Math.min(1, Math.log(d.f / RIVER_MIN_FLOW) / 5);
    const mi = clamp(Math.round(d.y), 0, H - 1) * W + clamp(Math.round(d.x), 0, W - 1);
    let landNear = -1;
    for (let r = 0; r < 6 && landNear < 0; r++)
      for (let yy = -r; yy <= r && landNear < 0; yy++) for (let xx = -r; xx <= r; xx++) {
        const j = clamp(Math.round(d.y) + yy, 0, H - 1) * W + clamp(Math.round(d.x) + xx, 0, W - 1);
        if (type[j]) { landNear = j; break; }
      }
    if (landNear < 0) continue;
    let added = 0;
    for (let y = Math.max(0, Math.floor(d.y - Ld)); y <= Math.min(H - 1, Math.ceil(d.y + Ld)); y++)
      for (let x = Math.max(0, Math.floor(d.x - Ld)); x <= Math.min(W - 1, Math.ceil(d.x + Ld)); x++) {
        const i = y * W + x;
        if (type[i] || elev[i] < -80) continue;
        const rx = x - d.x, ry = y - d.y, r = Math.sqrt(rx * rx + ry * ry);
        if (r > Ld || r < 0.5) continue;
        const cosA = (rx * d.dx + ry * d.dy) / r;
        // 扇の中心ほど遠くまで広がり、縁はノイズで分流路のように乱れる
        const reach = Ld * smoothstep(0.1, 0.9, cosA) * (0.75 + 0.35 * meanderN(x * 0.15, y * 0.15));
        if (r < reach) { elev[i] = 0.6 + 2.5 * (1 - r / Ld); type[i] = type[landNear]; regionId[i] = regionId[landNear]; biome[i] = biome[landNear]; added++; }
      }
    if (added > 20) { deltas++; landmarks.push({ kind: 'delta', x: Math.round(d.x), y: Math.round(d.y) }); }
  }

  // ---- 湖を全解像度に：湖の水位より低いセルを湖面とする
  const lakeId = new Uint16Array(N);
  const lakeCount = new Int32Array(lakeLevelC.length);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (!type[i]) continue;
    const L = cLake[Math.min(CH - 1, (y / HR) | 0) * CW + Math.min(CW - 1, (x / HR) | 0)];
    if (L && elev[i] < lakeLevelC[L]) { lakeId[i] = L; lakeCount[L]++; }
  }
  const lakeRemap = new Uint16Array(lakeLevelC.length);
  const lakeLevels = [0], lakeSalt = [0];
  for (let L = 1; L < lakeLevelC.length; L++) {
    if (lakeCount[L] >= LAKE_MIN_CELLS && lakeLevels.length < 65535) { lakeRemap[L] = lakeLevels.length; lakeLevels.push(lakeLevelC[L]); lakeSalt.push(lakeSaltC[L]); }
  }
  // 塩の平原（全解像度）
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (type[i] && saltFlatC[Math.min(CH - 1, (y / HR) | 0) * CW + Math.min(CW - 1, (x / HR) | 0)]) biome[i] = BIOME.SALT_FLAT;
  }
  for (let i = 0; i < N; i++) if (lakeId[i]) lakeId[i] = lakeRemap[lakeId[i]];

  // ---- 河川を全解像度の水域データに書き込み、描画用の折れ線を作る
  const water = new Uint8Array(N);   // 0=なし 1=河川 2=湖
  for (let i = 0; i < N; i++) if (lakeId[i]) water[i] = 2;
  const outPts = [], outStarts = [], outLine = [];
  // 川ごとの情報（名前を付けるのに使う）：河口から始まる本流か、最大の流量、長さ（点の数）
  const lineMouth = new Uint8Array(lines.length), lineFlow = new Float32Array(lines.length), lineLen = new Int32Array(lines.length);
  for (let li = 0; li < lines.length; li++) {
    const L = lines[li];
    lineMouth[li] = L.mouth ? 1 : 0; lineLen[li] = L.pts.length;
    for (const p of L.pts) if (p.f > lineFlow[li]) lineFlow[li] = p.f;
    let cur = [];
    const flush = () => { if (cur.length > 1) { outStarts.push(outPts.length / 3); outLine.push(li); for (const p of cur) outPts.push(p.x, p.y, p.w); } cur = []; };
    for (const p of L.pts) {
      const i = clamp(Math.round(p.y), 0, H - 1) * W + clamp(Math.round(p.x), 0, W - 1);
      if (!type[i] || lakeId[i]) { flush(); continue; }   // 海・湖の中は描かない
      const w = widthOf(p.f);
      cur.push({ x: p.x, y: p.y, w });
      const r = w / 2;
      for (let y = Math.max(0, Math.floor(p.y - r)); y <= Math.min(H - 1, Math.ceil(p.y + r)); y++)
        for (let x = Math.max(0, Math.floor(p.x - r)); x <= Math.min(W - 1, Math.ceil(p.x + r)); x++) {
          const j = y * W + x, dx = x - p.x, dy = y - p.y;
          if (type[j] && !lakeId[j] && dx * dx + dy * dy <= r * r + 0.25) water[j] = 1;
        }
    }
    flush();
  }
  return {
    water, lakeId, lakeLevels: Float32Array.from(lakeLevels), lakeSalt: Uint8Array.from(lakeSalt), landmarks,
    riverPts: Float32Array.from(outPts), riverStarts: Int32Array.from(outStarts),
    // riverLine：描画用の線ごとに、元の川の番号。川の番号ごとに mouth（本流か）・flow（最大流量）・len（長さ）
    riverLine: Int32Array.from(outLine), riverInfo: { mouth: lineMouth, flow: lineFlow, len: lineLen },
    riverCount: mainRivers, lakeCount: lakeLevels.length - 1, fjords, estuaries, deltas, drowned, rias, canyons, gorges, waterfalls: landmarks.filter(f => f.kind === 'waterfall').length,
  };
}

// 島の数（群島の島は1つずつ数える）
function countIslands(type, regionId) {
  const seen = new Uint8Array(65536);
  let n = 0;
  for (let i = 0; i < N; i++) if (type[i] === 2 && !seen[regionId[i]]) { seen[regionId[i]] = 1; n++; }
  return n;
}

// ================================================================ 5b. 世界の特徴となる地形
// このマップが世界の全てなので、地質・気候から自然に起こりうる場所に、目立つ地形をつくる。
// 気候の前（標高を大きく変えるもの）、気候の後・水系の前、水系の後の3段階に分けて行う。
// 位置の分かる地形は features に { kind, x, y } として記録する（表示の目印・数の集計に使う）
const RIFT_DEPTH = 1100;              // 大地溝帯の谷の深さ（m）
const RIFT_SHOULDER = 380;            // 地溝の両側の盛り上がり（m）
const PLATEAU_MIN_BLOCKS = 22000;     // 大高原（標高 3000m 以上）の広さがこれ未満ならつくる
const PLATEAU_HEIGHT = [3900, 4700];  // つくる大高原の高さ（m）
const INLAND_SEA_R = [85, 150];       // 内海の大きさ（半径、ブロック）
const STRAIT_HALF_WIDTH = [2.2, 4.5]; // 海峡の幅の半分（ブロック）
const BANK_COUNT = [2, 4];            // 浅瀬（バンク）の数
const BARRIER_COAST_SHARE = 0.25;     // 平らな海岸のうち、堡礁島（沿岸の細長い島）ができる割合
const FEATURE_KIND = {
  rift: '大地溝帯', plateau: '大高原', inlandSea: '内海', strait: '海峡', bank: '浅瀬', barrier: '堡礁島',
  mesa: '台地・メサ', karst: 'カルスト', cave: '鍾乳洞', atoll: '環礁', ria: 'リアス海岸', fjord: 'フィヨルド',
  canyon: '大峡谷', gorge: '渓谷', waterfall: '滝', saltLake: '塩湖', saltFlat: '塩の平原', delta: '三角州',
  wetland: '大湿地', erg: '大砂丘', glacier: '氷河', reef: 'サンゴ礁', harbor: '天然の良港', hotSpring: '温泉', spring: '湧水地',
};

// 単位ベクトル（三角関数を使わずに決定的に）
function randDir(rng) {
  for (;;) {
    const x = rng() * 2 - 1, y = rng() * 2 - 1, l = x * x + y * y;
    if (l > 0.05 && l <= 1) { const s = Math.sqrt(l); return [x / s, y / s]; }
  }
}
// 陸からの距離（海のセル）・海からの距離（陸のセル）
function coastDistances(type, want) {
  const out = {};
  if (!want || want.sea) { const sea = new Uint8Array(N); for (let i = 0; i < N; i++) sea[i] = type[i] ? 0 : 1; out.toSea = distanceTransform(sea); }
  if (!want || want.land) { const land = new Uint8Array(N); for (let i = 0; i < N; i++) land[i] = type[i] ? 1 : 0; out.toLand = distanceTransform(land); }
  return out;
}

function generateLandmarksGeo(seed, tec, ter, progress) {
  progress('特徴的な地形');
  const rng = subRng(seed, 'landmarks-geo');
  const nz = makeNoise(rng), nz2 = makeNoise(rng);
  const { elev, type, regionId } = ter;
  const feats = [];
  let { toSea } = coastDistances(type, { sea: 1 });

  // ---- 1. 大地溝帯：大陸が裂け始めた所（リフト帯）に、両側が盛り上がった深い谷をつくる
  const rift = new Float32Array(TN);
  let riftLand = 0;
  for (let gy = 0; gy < TH; gy++) for (let gx = 0; gx < TW; gx++) {
    const gi = gy * TW + gx, i = Math.min(H - 1, gy * TS + TS / 2) * W + Math.min(W - 1, gx * TS + TS / 2);
    if (tec.crust[gi] === CRUST.RIFT && type[i] && toSea[i] > 25) { rift[gi] = 1; riftLand++; }
  }
  if (riftLand < 40) {
    // リフト帯が無ければ、一番大きな大陸の内部を裂く（大陸が分裂し始めたところ）
    let best = -1, bs = 0;
    for (let k = 0; k < 3000; k++) {
      const x = Math.floor(rng() * W), y = Math.floor(rng() * H), i = y * W + x;
      if (type[i] !== 1 || regionId[i] !== 1) continue;
      if (toSea[i] > bs) { bs = toSea[i]; best = i; }
    }
    if (best >= 0 && bs > 120) {
      const [dx, dy] = randDir(rng), len = 380 + rng() * 300;
      let x = best % W - dx * len / 2, y = (best - best % W) / W - dy * len / 2, hx = dx, hy = dy;
      for (let s = 0; s < len; s += 3) {
        // 少しずつ向きを揺らす
        const t = 0.25 * nz(x * 0.004, y * 0.004);
        const nx = hx - hy * t, ny = hy + hx * t, l = Math.sqrt(nx * nx + ny * ny); hx = nx / l; hy = ny / l;
        x += hx * 3; y += hy * 3;
        if (x < 0 || y < 0 || x >= W || y >= H) break;
        const i = Math.round(y) * W + Math.round(x);
        if (!type[i] || toSea[i] < 30) continue;
        rift[geoIndexAt(Math.round(x), Math.round(y))] = 1;
      }
    }
  }
  {
    // ならして谷の断面にする
    const tmp = new Float32Array(TN);
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
        let s = 0, n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx, yy = y + dy;
          if (xx < 0 || yy < 0 || xx >= TW || yy >= TH) continue;
          s += rift[yy * TW + xx]; n++;
        }
        tmp[y * TW + x] = s / n;
      }
      rift.set(tmp);
    }
    let cx = 0, cy = 0, cn = 0;
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
      const r = sampleGeo(rift, x, y);
      if (r < 0.06) continue;
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
        const i = (y + dy) * W + x + dx;
        if (!type[i] || elev[i] <= 0) continue;
        const rr = sampleGeo(rift, x + dx, y + dy) * (0.85 + 0.3 * nz2((x + dx) * 0.02, (y + dy) * 0.02));
        const g = smoothstep(0.32, 0.55, rr), sh = smoothstep(0.06, 0.3, rr) * (1 - g);
        const floor = Math.max(60, elev[i] * 0.25);
        elev[i] = Math.max(floor, elev[i] + RIFT_SHOULDER * sh - RIFT_DEPTH * g);
        if (g > 0.6) { cx += x; cy += y; cn++; }
      }
    }
    if (cn > 200) feats.push({ kind: 'rift', x: Math.round(cx / cn), y: Math.round(cy / cn) });
  }

  // ---- 2. 大高原：標高 3000m 以上の広い高原が無ければ、大陸の内陸の山地の近くにつくる
  {
    const mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) mask[i] = type[i] && elev[i] > 3000 ? 1 : 0;
    const lab = labelComponents(mask);
    let big = 0, bk = 0;
    for (let k = 1; k <= lab.count; k++) if (lab.sizes[k] > big) { big = lab.sizes[k]; bk = k; }
    if (big >= PLATEAU_MIN_BLOCKS) {
      let sx = 0, sy = 0;
      for (let i = 0; i < N; i++) if (lab.labels[i] === bk) { sx += i % W; sy += (i - i % W) / W; }
      feats.push({ kind: 'plateau', x: Math.round(sx / big), y: Math.round(sy / big) });
    } else {
      // 候補：海から遠く、すでにある程度高い所（山脈の背後）
      let best = -1, bs = -1;
      for (let y = 200; y < H - 200; y += 12) for (let x = 200; x < W - 200; x += 12) {
        const i = y * W + x;
        if (type[i] !== 1 || toSea[i] < 190) continue;
        const sc = Math.min(elev[i], 2500) + toSea[i] * 4 + 300 * rng();
        if (sc > bs) { bs = sc; best = i; }
      }
      if (best >= 0) {
        const px = best % W, py = (best - px) / W;
        const [ca, sa] = randDir(rng);
        const rx = Math.min(toSea[best] * 0.75, 150 + rng() * 60), ry = rx * (0.55 + 0.25 * rng());
        const Hp = PLATEAU_HEIGHT[0] + (PLATEAU_HEIGHT[1] - PLATEAU_HEIGHT[0]) * rng();
        const R = Math.ceil(rx * 1.25);
        for (let y = Math.max(0, py - R); y <= Math.min(H - 1, py + R); y++) for (let x = Math.max(0, px - R); x <= Math.min(W - 1, px + R); x++) {
          const i = y * W + x;
          if (!type[i]) continue;
          const ox = x - px, oy = y - py, u = (ox * ca + oy * sa) / rx, v = (-ox * sa + oy * ca) / ry;
          const d = Math.sqrt(u * u + v * v) * (1 + 0.22 * nz(x * 0.008, y * 0.008));
          if (d >= 1.2) continue;
          // 縁は急な崖（大山脈）、上は起伏の小さな高原
          const w = smoothstep(1.2, 0.7, d);
          // 高原の上にも、ゆるやかな盆地と低い山並み・湖の窪地がある
          const rr = ridged(nz, x * 0.022, y * 0.022, 3);
          const top = Hp + 380 * fbm(nz2, x * 0.01, y * 0.01, 3) + 650 * rr * rr - 200 + 500 * smoothstep(0.85, 1.05, d) * rr;
          const ne = elev[i] + (top - elev[i]) * w;
          if (ne > elev[i]) elev[i] = ne;
        }
        feats.push({ kind: 'plateau', x: px, y: py });
      }
    }
  }

  // ---- 3. 内海と海峡：大陸の内側に広い海をつくり、細い海峡で外の海とつなぐ（地中海・黒海のような海）
  {
    let best = -1, bs = -1;
    for (let k = 0; k < 4000; k++) {
      const x = 200 + Math.floor(rng() * (W - 400)), y = 200 + Math.floor(rng() * (H - 400)), i = y * W + x;
      if (type[i] !== 1 || elev[i] > 900 || toSea[i] < 170 || toSea[i] > 330) continue;
      const sc = toSea[i] - elev[i] * 0.05 + rng() * 40;
      if (sc > bs) { bs = sc; best = i; }
    }
    if (best >= 0) {
      const px = best % W, py = (best - px) / W;
      const [ca, sa] = randDir(rng);
      const rx = Math.min(toSea[best] * 0.6, INLAND_SEA_R[0] + rng() * (INLAND_SEA_R[1] - INLAND_SEA_R[0])), ry = rx * (0.5 + 0.3 * rng());
      const R = Math.ceil(rx * 1.3);
      let area = 0;
      for (let y = Math.max(0, py - R); y <= Math.min(H - 1, py + R); y++) for (let x = Math.max(0, px - R); x <= Math.min(W - 1, px + R); x++) {
        const i = y * W + x;
        const ox = x - px, oy = y - py, u = (ox * ca + oy * sa) / rx, v = (-ox * sa + oy * ca) / ry;
        const d = Math.sqrt(u * u + v * v) * (1 + 0.28 * fbm(nz2, x * 0.012, y * 0.012, 3));
        if (d >= 1.25) continue;
        if (d < 1) {
          const depth = 120 + 1500 * smoothstep(1, 0.35, d);
          if (type[i] || elev[i] > -depth) { elev[i] = -depth; type[i] = 0; regionId[i] = 0; area++; }
        } else if (type[i]) {
          // 岸の近くは低い平野
          elev[i] = Math.min(elev[i], 4 + (elev[i] - 4) * smoothstep(1, 1.25, d));
        }
      }
      // 海峡：内海の中心から、外の海までの距離（内海をつくる前の値）が減る方へ細い水路を掘る
      let x = px, y = py, minW = 99, sxp = 0, syp = 0;
      for (let guard = 0; guard < 3000; guard++) {
        const i = y * W + x;
        if (toSea[i] <= 0) break;   // 外の海に着いた
        let bx = -1, by = -1, bd = 1e9;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const xx = x + dx, yy = y + dy;
          if (xx < 1 || yy < 1 || xx >= W - 1 || yy >= H - 1) continue;
          const j = yy * W + xx;
          if (toSea[j] >= toSea[i]) continue;
          const d = toSea[j] + 0.3 * nz(xx * 0.05, yy * 0.05);
          if (d < bd) { bd = d; bx = xx; by = yy; }
        }
        if (bx < 0) break;
        x = bx; y = by;
        if (!type[y * W + x]) continue;   // 内海の中
        const hw = STRAIT_HALF_WIDTH[0] + (STRAIT_HALF_WIDTH[1] - STRAIT_HALF_WIDTH[0]) * (0.5 + 0.5 * nz2(x * 0.02, y * 0.02));
        if (hw < minW) { minW = hw; sxp = x; syp = y; }
        const r = Math.ceil(hw);
        for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) {
          const dd = (xx - x) * (xx - x) + (yy - y) * (yy - y);
          if (dd > hw * hw) continue;
          const j = yy * W + xx, de = -50 - 40 * (1 - Math.sqrt(dd) / hw);
          if (type[j] || elev[j] > de) { elev[j] = de; type[j] = 0; regionId[j] = 0; }
        }
      }
      if (area > 2000) {
        feats.push({ kind: 'inlandSea', x: px, y: py });
        if (minW < 99) feats.push({ kind: 'strait', x: sxp, y: syp });
      }
    }
  }
  const { toLand: toLandG } = coastDistances(type, { land: 1 });

  // ---- 4. 浅瀬（バンク）：大陸棚の沖にある、海の中の浅い台地（好漁場）
  {
    const toLand = toLandG;
    const nB = BANK_COUNT[0] + Math.floor(rng() * (BANK_COUNT[1] - BANK_COUNT[0] + 1));
    let made = 0;
    for (let k = 0; k < 6000 && made < nB; k++) {
      const x = 150 + Math.floor(rng() * (W - 300)), y = 150 + Math.floor(rng() * (H - 300)), i = y * W + x;
      if (type[i] || toLand[i] < 40 || toLand[i] > 160 || elev[i] < -2500 || elev[i] > -150) continue;
      const Rb = 25 + rng() * 35, R = Math.ceil(Rb * 1.4);
      for (let yy = y - R; yy <= y + R; yy++) for (let xx = x - R; xx <= x + R; xx++) {
        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
        const j = yy * W + xx;
        if (type[j]) continue;
        const d = Math.sqrt((xx - x) * (xx - x) + (yy - y) * (yy - y)) / Rb * (1 + 0.3 * nz(xx * 0.03, yy * 0.03));
        if (d >= 1.4) continue;
        const target = -18 - 30 * smoothstep(0.4, 1, d);
        const w = smoothstep(1.4, 0.9, d);
        const ne = elev[j] + (target - elev[j]) * w;
        if (ne > elev[j]) elev[j] = Math.min(ne, -6);
      }
      feats.push({ kind: 'bank', x, y });
      made++;
    }
  }

  // ---- 5. 堡礁島：遠浅で平らな海岸の沖に、海岸に沿った細長い砂の島が連なる
  {
    const toLand = toLandG;
    const isl = new Uint8Array(N);
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      const i = y * W + x;
      if (type[i] || toLand[i] < 2.6 || toLand[i] > 4.8 || elev[i] < -300) continue;
      if (nz(x * 0.006 + 11.3, y * 0.006 - 4.2) < 1 - 2 * BARRIER_COAST_SHARE) continue;   // 一部の海岸だけ
      if (nz2(x * 0.09, y * 0.09) < -0.35) continue;                                      // ところどころ切れて水路（潮口）になる
      // 近くの陸が低く平らなこと
      let flat = true;
      for (let k = 0; k < 8 && flat; k++) {
        const xx = x + [6, -6, 0, 0, 5, -5, 5, -5][k], yy = y + [0, 0, 6, -6, 5, 5, -5, -5][k];
        const j = yy * W + xx;
        if (type[j] && elev[j] > 60) flat = false;
      }
      if (flat) isl[i] = 1;
    }
    const lab = labelComponents(isl);
    let made = 0;
    for (let i = 0; i < N; i++) {
      const k = lab.labels[i];
      if (!k || lab.sizes[k] < 12) continue;
      elev[i] = 2.5 + nz(i % W * 0.2, (i - i % W) / W * 0.2);
      type[i] = 2; regionId[i] = Math.min(65535, ter.nextId + k);
      made++;
    }
    ter.nextId = Math.min(65535, ter.nextId + lab.count + 1);
    if (made > 0) {
      // 代表の位置（一番大きな島）
      let bk = 0; for (let k = 1; k <= lab.count; k++) if (!bk || lab.sizes[k] > lab.sizes[bk]) bk = k;
      for (let i = 0; i < N; i++) if (lab.labels[i] === bk) { feats.push({ kind: 'barrier', x: i % W, y: (i - i % W) / W, count: lab.count }); break; }
    }
  }
  return feats;
}

// ---- 気候の後・水系の前：乾燥地の台地（メサ）、石灰岩のカルスト、熱帯の環礁
const MESA_STEP = 190;                // メサの段の高さ（m）
const KARST_SHARE = 0.22;             // 雨の多い地域のうち石灰岩地帯（カルスト）の割合
const ATOLL_MAX = 14;                 // 環礁の数の上限
function generateLandmarksClim(seed, ter, clim, progress) {
  progress('特徴的な地形（気候）');
  const rng = subRng(seed, 'landmarks-clim');
  const nz = makeNoise(rng), nz2 = makeNoise(rng), nz3 = makeNoise(rng);
  const { elev, type, regionId } = ter;
  const feats = [];
  const karst = new Uint8Array(LW * LH);   // 粗いグリッドのカルストの印（鍾乳洞を置くのに使う）
  // 乾燥した高い土地の一部を、平らな頂と崖の段々にする。湿潤な石灰岩地帯は塔のような岩山やくぼ地にする
  const gMesa = lowResGrid((x, y) => {
    const P = sampleLow(clim.precip, x, y);
    return smoothstep(380, 180, P) * smoothstep(0.05, 0.35, nz(x * 0.004, y * 0.004));
  });
  const gKarst = lowResGrid((x, y) => {
    const P = sampleLow(clim.precip, x, y), T = sampleLow(clim.tempSea, x, y);
    return smoothstep(900, 1300, P) * smoothstep(2, 8, T) * smoothstep(1 - 2 * KARST_SHARE, 1 - 2 * KARST_SHARE + 0.15, nz2(x * 0.003, y * 0.003));
  });
  let mesaN = 0, mx = 0, my = 0, karstN = 0, kx = 0, ky = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (!type[i]) continue;
    const e = elev[i];
    const wm = sampleLow(gMesa, x, y);
    if (wm > 0.02 && e > 350 && e < 3200) {
      // 段々（テラス）：段の境目を少し揺らして、メサの輪郭を不規則にする
      const t = (e + 90 * nz3(x * 0.03, y * 0.03)) / MESA_STEP, f = t - Math.floor(t);
      const te = (Math.floor(t) + smoothstep(0.62, 0.8, f)) * MESA_STEP - 90 * nz3(x * 0.03, y * 0.03);
      elev[i] = e + (te - e) * wm;
      if (wm > 0.6) { mesaN++; mx += x; my += y; }
    }
    const wk = sampleLow(gKarst, x, y);
    if (wk > 0.02 && e > 5 && e < 1600) {
      const T = sampleLow(clim.tempSea, x, y);
      // 熱帯：塔のような石灰岩の山（タワーカルスト）。温帯：すり鉢状のくぼ地（ドリーネ）
      const r = 1 - Math.abs(nz3(x * 0.11 + 5.1, y * 0.11 - 2.7));
      const tower = r * r * r * r;
      const tropical = smoothstep(16, 22, T);
      elev[i] = Math.max(2, e + wk * (tropical * 260 * tower - (1 - tropical) * 45 * smoothstep(0.55, 0.9, r)));
      if (wk > 0.6) { karstN++; kx += x; ky += y; karst[Math.round(y / LR) * LW + Math.round(x / LR)] = 1; }
    }
  }
  if (mesaN > 3000) feats.push({ kind: 'mesa', x: Math.round(mx / mesaN), y: Math.round(my / mesaN), area: mesaN });
  if (karstN > 3000) feats.push({ kind: 'karst', x: Math.round(kx / karstN), y: Math.round(ky / karstN), area: karstN });

  // ---- 環礁：熱帯の暖かい海で、沈みかけた火山島のまわりにサンゴが輪のように育つ
  const cl = clim.data, sstMin = new Float32Array(CLN).fill(99);
  for (let m = 0; m < 12; m++) for (let c = 0; c < CLN; c++) { const v = cl.sst[m * CLN + c] / 10; if (v < sstMin[c]) sstMin[c] = v; }
  const warm = (x, y) => sstMin[Math.min(CLH - 1, (y / CLIMATE_STEP) | 0) * CLW + Math.min(CLW - 1, (x / CLIMATE_STEP) | 0)] >= 21;
  const cand = [];
  for (const v of ter.volcanoes) if (v.summit < -40 && v.summit > -1800 && warm(v.x, v.y)) cand.push({ x: v.x, y: v.y });
  // 火山が足りなければ、熱帯の深い海の海山（古い火山）にもつくる
  for (let k = 0; k < 3000 && cand.length < ATOLL_MAX; k++) {
    const x = 120 + Math.floor(rng() * (W - 240)), y = 120 + Math.floor(rng() * (H - 240)), i = y * W + x;
    if (type[i] || elev[i] > -1500 || !warm(x, y)) continue;
    if (cand.some(c => (c.x - x) * (c.x - x) + (c.y - y) * (c.y - y) < 90 * 90)) continue;
    let landNear = false;
    for (let d = 0; d < 8 && !landNear; d++) { const j = Math.min(N - 1, Math.max(0, i + [60, -60, 60 * W, -60 * W, 40 + 40 * W, -40 - 40 * W, 40 - 40 * W, -40 + 40 * W][d])); if (type[j]) landNear = true; }
    if (!landNear) cand.push({ x, y });
  }
  let atolls = 0;
  for (const c of cand) {
    if (atolls >= ATOLL_MAX) break;
    const r = 4 + rng() * 5, R = Math.ceil(r + 3), id = Math.min(65535, ter.nextId++);
    let land = 0;
    for (let y = c.y - R; y <= c.y + R; y++) for (let x = c.x - R; x <= c.x + R; x++) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const i = y * W + x, d = Math.sqrt((x - c.x) * (x - c.x) + (y - c.y) * (y - c.y));
      if (d > r + 2.5) continue;
      if (Math.abs(d - r) < 0.9 && nz(x * 0.4, y * 0.4) > -0.45) { elev[i] = 1.5; type[i] = 2; regionId[i] = id; land++; }   // サンゴの島（ところどころ切れる）
      else if (d < r) { if (!type[i]) elev[i] = -12 - 6 * (1 - d / r); }                                                  // 礁湖（ラグーン）
      else if (!type[i]) elev[i] = Math.max(elev[i], -8 - 60 * (d - r) / 2.5);                                          // 礁の外側
    }
    if (land > 6) { feats.push({ kind: 'atoll', x: c.x, y: c.y }); atolls++; }
  }
  return { feats, karst };
}

// ---- 水系の後：大湿地・大砂丘・氷河・サンゴ礁（植生の区分）と、天然の良港・温泉・湧水地・鍾乳洞・海峡（位置）
const FEATURE_SPACING = { harbor: 70, hotSpring: 45, spring: 60, cave: 45, strait: 90 };
const FEATURE_MAX = { harbor: 40, hotSpring: 60, spring: 50, cave: 40, strait: 25 };
function generateLandmarksPost(seed, tec, ter, clim, hydro, karst, progress) {
  progress('特徴的な地形（水系）');
  const rng = subRng(seed, 'landmarks-post');
  const nz = makeNoise(rng), nz2 = makeNoise(rng);
  const { elev, type } = ter, biome = clim.biome, water = hydro.water;
  const feats = [];
  const B = BIOME;
  const wmask = new Uint8Array(N);
  for (let i = 0; i < N; i++) wmask[i] = water[i] ? 1 : 0;
  const toWater = distanceTransform(wmask);
  const { toLand } = coastDistances(type, { land: 1 });
  // 海面水温の最低（サンゴ礁）
  const cl = clim.data, sstMin = new Float32Array(CLN).fill(99);
  for (let m = 0; m < 12; m++) for (let c = 0; c < CLN; c++) { const v = cl.sst[m * CLN + c] / 10; if (v < sstMin[c]) sstMin[c] = v; }
  const iceMask = new Uint8Array(N), ergMask = new Uint8Array(N), wetMask = new Uint8Array(N);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x, e = elev[i];
    if (!type[i]) {
      // サンゴ礁：一年中暖かい海の、海岸近くの浅い所
      const c = Math.min(CLH - 1, (y / CLIMATE_STEP) | 0) * CLW + Math.min(CLW - 1, (x / CLIMATE_STEP) | 0);
      if (e > -55 && toLand[i] <= 9 && sstMin[c] >= 20.5 && nz(x * 0.05, y * 0.05) > -0.3) biome[i] = B.REEF;
      continue;
    }
    if (water[i]) continue;
    const P = sampleLow(clim.precip, x, y), Ts = sampleLow(clim.tempSea, x, y), T = Ts - 0.0065 * Math.max(0, e);
    const b = biome[i];
    // 高原の上の平らな土地は、灰色の岩山（高山）ではなく、乾いた草原やツンドラ
    if (b === B.ALPINE && T > -14) {
      const relief = Math.abs(elev[i + 3] - elev[i - 3]) + Math.abs(elev[i + 3 * W] - elev[i - 3 * W]);
      if (relief < 450 + 30 * (T + 14)) { biome[i] = P < 450 ? B.STEPPE : B.TUNDRA; continue; }
    }
    // 氷河：寒く雪の多い高山は氷に覆われる
    if (T < -3.5 && P > 350 && e > 800) { biome[i] = B.ICE; iceMask[i] = 1; continue; }
    if (b === B.ICE) { iceMask[i] = 1; continue; }
    // 大湿地：川や湖の近くの、平らで低く雨の多い土地
    const flat = Math.abs(elev[i + 1] - elev[i - 1]) + Math.abs(elev[i + W] - elev[i - W]) < 6;
    if (flat && e < 160 && toWater[i] < 10 && P > 750 && T > -2 && b !== B.DESERT && nz2(x * 0.01, y * 0.01) > -0.15) {
      biome[i] = B.WETLAND; wetMask[i] = 1; continue;
    }
    // 大砂丘（砂の海）：ひどく乾いた平らな砂漠
    if (b === B.DESERT && P < 160 && flat && nz(x * 0.004 + 3.3, y * 0.004) > -0.1) { biome[i] = B.DUNES; ergMask[i] = 1; }
  }
  // 氷河の舌：氷河から谷（川）に沿って少し下まで氷が伸びる
  for (let pass = 0; pass < 2; pass++) {
    const add = [];
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      const i = y * W + x;
      if (!type[i] || iceMask[i] || toWater[i] > 3) continue;
      const T = sampleLow(clim.tempSea, x, y) - 0.0065 * Math.max(0, elev[i]);
      if (T > 2) continue;
      let near = false;
      for (let d = 1; d <= 6 && !near; d++) if (iceMask[i + d] || iceMask[i - d] || iceMask[i + d * W] || iceMask[i - d * W]) near = true;
      if (near) add.push(i);
    }
    for (const i of add) { iceMask[i] = 1; biome[i] = B.ICE; }
  }
  // 広い範囲の地形は、まとまりごとに代表の位置を1つ記録する
  const regions = (mask, kind, minSize) => {
    const lab = labelComponents(mask), sx = new Float64Array(lab.count + 1), sy = new Float64Array(lab.count + 1);
    for (let i = 0; i < N; i++) { const k = lab.labels[i]; if (k) { sx[k] += i % W; sy[k] += (i - i % W) / W; } }
    for (let k = 1; k <= lab.count; k++) if (lab.sizes[k] >= minSize) feats.push({ kind, x: Math.round(sx[k] / lab.sizes[k]), y: Math.round(sy[k] / lab.sizes[k]), area: lab.sizes[k] });
  };
  regions(iceMask, 'glacier', 300);
  regions(ergMask, 'erg', 2500);
  regions(wetMask, 'wetland', 1200);
  const reef = new Uint8Array(N);
  for (let i = 0; i < N; i++) reef[i] = biome[i] === B.REEF && !type[i] ? 1 : 0;
  regions(reef, 'reef', 120);
  const salt = new Uint8Array(N);
  for (let i = 0; i < N; i++) salt[i] = biome[i] === B.SALT_FLAT ? 1 : 0;
  regions(salt, 'saltFlat', 300);
  // 塩湖：湖ごとに1つ
  {
    const L = hydro.lakeSalt.length, sx = new Float64Array(L), sy = new Float64Array(L), cnt = new Int32Array(L);
    for (let i = 0; i < N; i++) { const l = hydro.lakeId[i]; if (l && hydro.lakeSalt[l]) { sx[l] += i % W; sy[l] += (i - i % W) / W; cnt[l]++; } }
    for (let l = 1; l < L; l++) if (cnt[l]) feats.push({ kind: 'saltLake', x: Math.round(sx[l] / cnt[l]), y: Math.round(sy[l] / cnt[l]) });
  }

  // ---- 点で表す地形：間隔を空けて選ぶ
  const pick = (kind, cands) => {
    cands.sort((a, b) => b.s - a.s || a.i - b.i);
    const chosen = [], sp = FEATURE_SPACING[kind];
    for (const c of cands) {
      if (chosen.length >= FEATURE_MAX[kind]) break;
      const x = c.i % W, y = (c.i - x) / W;
      if (chosen.some(o => (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y) < sp * sp)) continue;
      chosen.push({ kind, x, y });
    }
    feats.push(...chosen);
  };
  // 天然の良港：陸に囲まれて波が静かで、岸のすぐ近くまで深い入江
  {
    const cands = [];
    for (let y = 20; y < H - 20; y += 3) for (let x = 20; x < W - 20; x += 3) {
      const i = y * W + x;
      if (type[i] || toLand[i] > 2.5 || elev[i] > -12) continue;
      let land = 0, tot = 0;
      for (const r of [7, 14]) for (let k = 0; k < 16; k++) {
        const a = k / 16 * 2 * Math.PI, xx = Math.round(x + r * dcos(a)), yy = Math.round(y + r * dsin(a));
        tot++; if (type[yy * W + xx]) land++;
      }
      const shelter = land / tot;
      if (shelter >= 0.58) cands.push({ i, s: shelter - elev[i] * 0.0005 });
    }
    pick('harbor', cands);
  }
  // 温泉：火山・地溝帯・断層の近く
  {
    const cands = [];
    for (const v of ter.volcanoes) {
      for (let k = 0; k < 6; k++) {
        const a = rng() * 2 * Math.PI, r = v.radius * (0.6 + rng() * 1.6);
        const x = Math.round(v.x + r * dcos(a)), y = Math.round(v.y + r * dsin(a));
        if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) continue;
        const i = y * W + x;
        if (type[i] && !water[i] && elev[i] > 2) cands.push({ i, s: (v.active ? 2 : 1) + rng() });
      }
    }
    for (let gy = 0; gy < TH; gy++) for (let gx = 0; gx < TW; gx++) {
      const gi = gy * TW + gx;
      if (tec.crust[gi] !== CRUST.RIFT && tec.fault[gi] < 8) continue;
      const x = gx * TS + Math.floor(rng() * TS), y = gy * TS + Math.floor(rng() * TS), i = y * W + x;
      if (type[i] && !water[i] && elev[i] > 2 && rng() < 0.15) cands.push({ i, s: 0.5 + rng() });
    }
    pick('hotSpring', cands);
  }
  // 湧水地：雨の多い山のふもと（急な斜面が平地に変わる所）と、カルストの縁
  {
    const cands = [];
    for (let y = 20; y < H - 20; y += 6) for (let x = 20; x < W - 20; x += 6) {
      const i = y * W + x;
      if (!type[i] || water[i] || elev[i] < 30 || elev[i] > 1500) continue;
      const P = sampleLow(clim.precip, x, y);
      if (P < 700) continue;
      let up = 0;
      for (const [dx, dy] of [[12, 0], [-12, 0], [0, 12], [0, -12]]) up = Math.max(up, elev[(y + dy) * W + x + dx] - elev[i]);
      const k = karst[Math.round(y / LR) * LW + Math.round(x / LR)] ? 300 : 0;
      if (up > 350 || k) cands.push({ i, s: up + k + rng() * 100 });
    }
    pick('spring', cands);
  }
  // 鍾乳洞：カルスト（石灰岩地帯）
  {
    const cands = [];
    for (let gy = 0; gy < LH; gy++) for (let gx = 0; gx < LW; gx++) {
      if (!karst[gy * LW + gx]) continue;
      const x = Math.min(W - 1, gx * LR), y = Math.min(H - 1, gy * LR), i = y * W + x;
      if (type[i] && !water[i] && rng() < 0.08) cands.push({ i, s: rng() });
    }
    pick('cave', cands);
  }
  // 海峡：両側に陸が迫った、細い海の通り道
  {
    const cands = [];
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (let y = 30; y < H - 30; y += 4) for (let x = 30; x < W - 30; x += 4) {
      const i = y * W + x;
      if (type[i] || toLand[i] > 8 || toLand[i] < 1.5) continue;
      for (const [dx, dy] of dirs) {
        // 片方向と反対方向の両方に近くの陸がある
        let a = 0, b = 0;
        for (let s = 1; s <= 14 && !a; s++) if (type[(y + dy * s) * W + x + dx * s]) a = s;
        for (let s = 1; s <= 14 && !b; s++) if (type[(y - dy * s) * W + x - dx * s]) b = s;
        if (!a || !b || a + b > 18) continue;
        // 直交方向には海が続いている（水路になっている）
        const px = -dy, py = dx;
        let open = 0;
        for (let s = 6; s <= 30; s += 6) {
          if (!type[(y + py * s) * W + x + px * s]) open++;
          if (!type[(y - py * s) * W + x - px * s]) open++;
        }
        if (open >= 9) { cands.push({ i, s: 20 - (a + b) + rng() }); break; }
      }
    }
    pick('strait', cands);
  }
  return feats;
}

// ================================================================ 8. 動物の生息環境と個体群（動物の共通基盤は fauna-src）
// 全解像度の地形・植生・水系を、気候格子（8ブロック四方）ごとの環境にまとめる（値は 0〜255 の割合など）
function buildFaunaEnv(type, elev, biome, water, lakeId, cl) {
  const S = CLIMATE_STEP, n = CLN;
  const cnt = (k) => new Float32Array(n);
  const land = cnt(), forest = cnt(), grass = cnt(), desert = cnt(), tundra = cnt(), ice = cnt(), alpine = cnt(), ever = cnt();
  const wat = cnt(), lake = cnt(), es = cnt(), es2 = cnt(), wetB = cnt();
  const B = BIOME;
  for (let y = 0; y < H; y++) {
    const cy = Math.min(CLH - 1, (y / S) | 0);
    for (let x = 0; x < W; x++) {
      const i = y * W + x, c = cy * CLW + Math.min(CLW - 1, (x / S) | 0);
      if (water[i]) { wat[c]++; if (lakeId[i]) lake[c]++; }
      if (!type[i]) continue;
      land[c]++;
      const b = biome[i], e = elev[i];
      es[c] += e; es2[c] += e * e;
      if (b === B.TAIGA || b === B.TEMPERATE_FOREST || b === B.TEMPERATE_RAINFOREST || b === B.TROPICAL_SEASONAL || b === B.RAINFOREST) forest[c]++;
      if (b === B.TAIGA || b === B.TEMPERATE_RAINFOREST || b === B.RAINFOREST) ever[c]++;
      if (b === B.STEPPE || b === B.SAVANNA) grass[c]++;
      else if (b === B.DESERT || b === B.DUNES || b === B.SALT_FLAT) desert[c]++;
      else if (b === B.WETLAND) { grass[c]++; wetB[c]++; }
      else if (b === B.TUNDRA) tundra[c]++;
      else if (b === B.ICE) ice[c]++;
      else if (b === B.ALPINE) alpine[c]++;
    }
  }
  const u8 = () => new Uint8Array(n);
  const env = { land: u8(), forest: u8(), grass: u8(), desert: u8(), tundra: u8(), ice: u8(), alpine: u8(), evergreen: u8(),
    water: u8(), lake: u8(), rugged: u8(), wetland: u8() };
  const q = (v) => Math.max(0, Math.min(255, Math.round(v * 255)));
  // 川・湖のあるセルからの距離（セル）
  const hasW = new Uint8Array(n);
  for (let c = 0; c < n; c++) hasW[c] = wat[c] > 0 ? 1 : 0;
  const dist = distanceTransformGrid(hasW, CLW, CLH);
  for (let c = 0; c < n; c++) {
    const L = land[c];
    env.land[c] = q(L / (S * S));
    env.lake[c] = q(lake[c] / (S * S));
    if (!L) continue;
    env.forest[c] = q(forest[c] / L); env.grass[c] = q(grass[c] / L); env.desert[c] = q(desert[c] / L);
    env.tundra[c] = q(tundra[c] / L); env.ice[c] = q(ice[c] / L); env.alpine[c] = q(alpine[c] / L); env.evergreen[c] = q(ever[c] / L);
    const mean = es[c] / L, sd = Math.sqrt(Math.max(0, es2[c] / L - mean * mean));
    env.rugged[c] = q(sd / 800);
    // 水源：川・湖（近いほど使いやすい）と、雨の多い地域の小川・湧水
    const river = Math.max(0, 1 - dist[c] / 3), rainy = smoothstep(300, 1000, cl.pAnnual[c]) * 0.8;
    env.water[c] = q(Math.max(river, rainy));
    // 湿地：平らな低地で、水が多く雨も多い所
    const wf = wat[c] / L;
    env.wetland[c] = q(Math.max(wetB[c] / L, Math.min(1, wf * 6) * (1 - smoothstep(30, 120, sd)) * (1 - smoothstep(200, 600, mean)) * smoothstep(500, 1000, cl.pAnnual[c])));
  }
  return env;
}
const FAUNA_SPECIES_LIST = ['deer'];
function generateFauna(seed, type, elev, biome, hydro, cl, progress) {
  progress('動物の生息地');
  const env = buildFaunaEnv(type, elev, biome, hydro.water, hydro.lakeId, cl);
  const cc = { w: CLW, h: CLH, n: CLN, latRow: cl.latRow, tMean: cl.tMean, precip: cl.precip, zone: cl.zone };
  const f = faunaGenerate(seed, env, cc, CLIMATE_STEP * KM_PER_BLOCK, FAUNA_SPECIES_LIST);
  f.env = env;
  return f;
}

// ================================================================ 9. 自然の資源（鉱床・土・地下水・木材・石材・粘土・漁場・家畜化や栽培化できる野生の動植物）
// 地質・気候・水系・植生から、現実に近い場所に資源を置く。生成時に決まる「もともとの量」で、使われ方は後の段階で扱う。
// 格子：土・地下水・木材・石材・粘土は粗いグリッド（LR=4 ブロック）、漁場と野生の動植物は気候格子（8 ブロック）
const SOIL = {
  NONE: 0, ALLUVIAL: 1, CHERNOZEM: 2, VOLCANIC: 3, BROWN_FOREST: 4, TERRA_ROSSA: 5, RED: 6, LATERITE: 7,
  PODZOL: 8, TUNDRA: 9, PEAT: 10, DESERT: 11, SALINE: 12, ROCKY: 13,
};
// 土の種類ごとの、もともとの肥えぐあい（0〜1）［仮］
const SOIL_FERT = [0, 0.95, 1.0, 0.85, 0.7, 0.6, 0.5, 0.3, 0.3, 0.15, 0.4, 0.15, 0.05, 0.1];
const MINERAL = { coal: '石炭', gold: '金', silver: '銀', copper: '銅', iron: '鉄', tin: '錫' };
// 鉱床の数の目安（種類ごと）［仮］
const DEPOSIT_COUNT = { copper: [25, 40], silver: [14, 24], gold: [18, 30], tin: [10, 18], iron: [25, 40], coal: [20, 34] };
// 家畜化・栽培化できる野生の動植物。いる地域は一部に限られる（どこでも農耕・牧畜を始められるわけではない）
// zones：適した気候区分（KOPPEN のコード）、T：年平均気温の範囲、P：年降水量の範囲、patches：生息地のまとまりの数［仮］
const WILD_SPECIES = [
  { id: 'wheat', name: '野生の麦', kind: 'plant', use: '穀物', zones: [5, 6, 7], T: [8, 20], P: [250, 800], hills: true, patches: [1, 2] },
  { id: 'rice', name: '野生の稲', kind: 'plant', use: '穀物', zones: [1, 2, 3, 7], T: [18, 30], P: [1000, 4000], wet: true, patches: [1, 2] },
  { id: 'millet', name: '野生のアワ・キビ', kind: 'plant', use: '穀物', zones: [5, 7, 10, 9], T: [4, 17], P: [300, 900], patches: [1, 2] },
  { id: 'maize', name: '野生のトウモロコシの祖先', kind: 'plant', use: '穀物', zones: [3, 7, 13], T: [15, 25], P: [500, 1600], elev: [700, 2600], patches: [1, 1] },
  { id: 'potato', name: '野生のジャガイモ', kind: 'plant', use: '芋', zones: [13, 8, 11], T: [3, 14], P: [400, 1500], elev: [1800, 4500], tropicalLat: 32, patches: [1, 1] },
  { id: 'taro', name: '野生のタロイモ・ヤムイモ', kind: 'plant', use: '芋', zones: [1, 2, 3], T: [21, 30], P: [1300, 5000], patches: [1, 2] },
  { id: 'legume', name: '野生の豆', kind: 'plant', use: '豆', zones: [6, 7, 8, 10], T: [6, 20], P: [350, 1200], patches: [1, 2] },
  { id: 'cotton', name: '野生のワタ', kind: 'plant', use: '繊維', zones: [3, 5, 2], T: [19, 29], P: [400, 1300], patches: [1, 1] },
  { id: 'flax', name: '野生のアマ・アサ', kind: 'plant', use: '繊維', zones: [6, 7, 8, 9], T: [4, 17], P: [400, 1100], patches: [1, 1] },

  { id: 'horse', name: '野生のウマ', kind: 'animal', use: '乗用・役畜', zones: [5, 9, 10], T: [-4, 14], P: [200, 700], grass: true, patches: [1, 1] },
  { id: 'camel', name: '野生のラクダ', kind: 'animal', use: '乗用・運搬', zones: [4, 5], T: [8, 30], P: [20, 350], patches: [1, 1] },
  { id: 'fowl', name: '野生のニワトリの祖先', kind: 'animal', use: '肉・卵', zones: [1, 2, 3], T: [20, 30], P: [900, 4000], forest: true, patches: [1, 1] },
  { id: 'llama', name: 'リャマの祖先', kind: 'animal', use: '運搬・毛', zones: [13, 5, 11], T: [-2, 12], P: [150, 900], elev: [2500, 5000], patches: [1, 1] },
  { id: 'wolf', name: 'オオカミ（イヌの祖先）', kind: 'animal', use: '狩りの仲間・番犬', zones: [5, 6, 7, 8, 9, 10, 11], T: [-10, 18], P: [150, 2000], patches: [2, 3] },

function generateResources(seed, tec, ter, clim, hydro, karst, progress) {
  progress('自然の資源');
  const rng = subRng(seed, 'resources');
  const nz = makeNoise(rng);
  const { elev, type } = ter, biome = clim.biome, water = hydro.water, B = BIOME, cl = clim.data;
  const n = LW * LH;
  const soil = new Uint8Array(n), fert = new Uint8Array(n), gwDepth = new Uint8Array(n), gwRecharge = new Uint8Array(n), gwSaline = new Uint8Array(n);
  const wood = new Uint8Array(n), stone = new Uint8Array(n), clay = new Uint8Array(n);
  // 川・湖からの距離（粗いグリッドのセル数）
  const hasW = new Uint8Array(n), sea = new Uint8Array(n);
  for (let gy = 0; gy < LH; gy++) for (let gx = 0; gx < LW; gx++) {
    const x = Math.min(W - 1, gx * LR), y = Math.min(H - 1, gy * LR), g = gy * LW + gx;
    let w = 0;
    for (let dy = 0; dy < LR && y + dy < H; dy++) for (let dx = 0; dx < LR && x + dx < W; dx++) if (water[(y + dy) * W + x + dx]) w = 1;
    hasW[g] = w; sea[g] = type[y * W + x] ? 0 : 1;
  }
  const dW = distanceTransformGrid(hasW, LW, LH), dSea = distanceTransformGrid(sea, LW, LH);
  // 火山の近く（火山灰の土）
  const volcNear = new Uint8Array(n);
  for (const v of ter.volcanoes) {
    const R = v.radius * 2.5 / LR, cx = v.x / LR, cy = v.y / LR;
    for (let gy = Math.max(0, Math.floor(cy - R)); gy <= Math.min(LH - 1, Math.ceil(cy + R)); gy++)
      for (let gx = Math.max(0, Math.floor(cx - R)); gx <= Math.min(LW - 1, Math.ceil(cx + R)); gx++)
        if ((gx - cx) * (gx - cx) + (gy - cy) * (gy - cy) < R * R) volcNear[gy * LW + gx] = 1;
  }
  const q = (v) => Math.max(0, Math.min(255, Math.round(v * 255)));
  let fertSum = 0, fertN = 0;
  for (let gy = 0; gy < LH; gy++) for (let gx = 0; gx < LW; gx++) {
    const g = gy * LW + gx, x = Math.min(W - 2, Math.max(1, gx * LR)), y = Math.min(H - 2, Math.max(1, gy * LR)), i = y * W + x;
    if (!type[i]) continue;
    const e = Math.max(0, elev[i]), b = biome[i];
    const P = sampleLow(clim.precip, x, y), T = sampleLow(clim.tempSea, x, y) - 0.0065 * e;
    const xr = Math.min(W - 1, x + LR), xl = Math.max(0, x - LR), yd = Math.min(H - 1, y + LR), yu = Math.max(0, y - LR);
    // 傾き（m/m）：1ブロック≒3.33km
    const slope = (Math.abs(elev[y * W + xr] - elev[y * W + xl]) + Math.abs(elev[yd * W + x] - elev[yu * W + x])) / (2 * (xr - xl) * KM_PER_BLOCK * 1000) * 2;
    const gi = geoIndexAt(x, y), crust = tec.crust[gi], kst = karst[g];
    // ---- 土の種類
    let s;
    if (b === B.ICE || b === B.ALPINE || slope > 0.06) s = SOIL.ROCKY;
    else if (b === B.SALT_FLAT || (P < 220 && dW[g] > 30 && e < 600 && nz(x * 0.01, y * 0.01) > 0.2)) s = SOIL.SALINE;
    else if (b === B.DESERT || b === B.DUNES) s = SOIL.DESERT;
    else if (volcNear[g] && P > 350) s = SOIL.VOLCANIC;
    else if (b === B.WETLAND) s = SOIL.PEAT;
    else if (dW[g] <= 2 && slope < 0.01 && e < 900) s = SOIL.ALLUVIAL;
    else if (b === B.TUNDRA || T < -2) s = SOIL.TUNDRA;
    else if (b === B.TAIGA) s = SOIL.PODZOL;
    else if (kst) s = SOIL.TERRA_ROSSA;
    else if ((b === B.STEPPE || b === B.SAVANNA) && P > 280 && P < 750 && T > 0 && T < 17) s = SOIL.CHERNOZEM;
    else if (b === B.RAINFOREST) s = SOIL.LATERITE;
    else if (b === B.SAVANNA || b === B.TROPICAL_SEASONAL) s = SOIL.RED;
    else s = SOIL.BROWN_FOREST;
    soil[g] = s;
    // ---- 肥えぐあい：土のもともとの肥えぐあい × 水（乾きすぎ・湿りすぎ）× 気温 × 傾き
    const wetF = s === SOIL.ALLUVIAL ? 1 : smoothstep(150, 550, P) * (1 - 0.35 * smoothstep(2500, 4500, P));
    const tF = smoothstep(-3, 8, T) * (1 - 0.2 * smoothstep(26, 32, T));
    const sF = 1 - smoothstep(0.015, 0.06, slope);
    const f = SOIL_FERT[s] * (0.25 + 0.75 * wetF) * tF * sF;
    fert[g] = q(f); fertSum += f; fertN++;
    // ---- 地下水：深さ（m）・涵養（雨が地下にしみ込む量）・塩分
    let depth = 4 + 380 * (1 - smoothstep(150, 1200, P)) + Math.min(120, e * 0.04) + 25 * slope * 100;
    depth = Math.min(depth, 1.5 + 3.5 * dW[g]);
    if (b === B.WETLAND) depth = 0.5;
    if (kst) depth = Math.max(depth, 25 + 30 * (0.5 + 0.5 * nz(x * 0.02, y * 0.02)));
    gwDepth[g] = Math.max(0, Math.min(255, Math.round(depth)));
    const pet = Math.max(0, 300 + 45 * T);
    gwRecharge[g] = q(Math.max(0, (P - pet * 0.6)) / 900 * (kst ? 1.4 : 1) * (s === SOIL.ROCKY ? 0.5 : 1));
    gwSaline[g] = (b === B.SALT_FLAT || s === SOIL.SALINE || (dSea[g] <= 2 && P < 500) || (P < 200 && dW[g] > 10)) ? 1 : 0;
    // ---- 木材・石材・粘土
    const wd = [0, 0, 0, 0.02, 0.75, 0.05, 0.85, 1, 0, 0.2, 0.7, 1, 0, 0.3, 0, 0, 0][b] || 0;
    wood[g] = q(wd * (0.8 + 0.2 * nz(x * 0.03, y * 0.03)));
    const st = Math.max(slope * 12, kst ? 0.9 : 0, volcNear[g] ? 0.6 : 0, s === SOIL.ROCKY ? 0.8 : 0, crust === CRUST.CRATON && P < 500 ? 0.35 : 0);
    stone[g] = q(Math.min(1, st));
    const cy = Math.max(s === SOIL.ALLUVIAL ? 0.9 : 0, s === SOIL.PEAT ? 0.6 : 0, dW[g] <= 4 && slope < 0.01 ? 0.5 : 0, s === SOIL.CHERNOZEM ? 0.3 : 0);
    clay[g] = q(cy);
  }

  // ---- 鉱床：地質の成り立ちから（地質格子のセルを候補にして、間隔を空けて選ぶ）
  const deposits = [];
  const cand = { copper: [], silver: [], gold: [], tin: [], iron: [], coal: [] };
  for (let gy = 2; gy < TH - 2; gy++) for (let gx = 2; gx < TW - 2; gx++) {
    const gi = gy * TW + gx, x = gx * TS + TS / 2, y = gy * TS + TS / 2, i = y * W + x;
    if (!type[i]) continue;
    const c = tec.cause[gi], cr = tec.crust[gi], vh = tec.volcHist[gi], r = rng();
    const arc = c === CAUSE.VOLCANIC_ARC || c === CAUSE.SUBDUCTION_RANGE;
    const orog = c === CAUSE.COLLISION || c === CAUSE.SUBDUCTION_RANGE || c === CAUSE.OLD_OROGEN || cr === CRUST.OROGEN;
    // 銅：沈み込み帯の火山の地下（斑岩銅鉱床）。銀：火山の近くの熱水鉱床
    if (arc || vh > 300) { cand.copper.push([vh * 0.002 + (arc ? 1 : 0) + r, gi]); cand.silver.push([vh * 0.003 + r, gi]); }
    // 金：造山帯の熱水鉱脈
    if (orog) cand.gold.push([(c === CAUSE.OLD_OROGEN ? 1.2 : 1) + r, gi]);
    // 錫：大陸の衝突帯・古い造山帯の花崗岩
    if (c === CAUSE.COLLISION || c === CAUSE.OLD_OROGEN) cand.tin.push([1 + r, gi]);
    // 鉄：古い安定した大陸（縞状鉄鉱床）
    if (cr === CRUST.CRATON) cand.iron.push([Math.min(3, (tec.age[gi] || 0) / 100) + r, gi]);
    // 石炭：山脈の前の盆地・安定した大陸の低い盆地（昔の湿地の植物が埋もれた）
    if (c === CAUSE.FORELAND || (cr === CRUST.CRATON && tec.basin[gi] > 20) || (elev[i] < 500 && cr !== CRUST.OCEANIC && nz(x * 0.003, y * 0.003) > 0.45))
      cand.coal.push([(c === CAUSE.FORELAND ? 1.5 : 0.6) + tec.basin[gi] * 0.01 + r, gi]);
  }
  const SIZE = [['小', 0.55], ['中', 0.3], ['大', 0.12], ['巨大', 0.03]];
  for (const kind in cand) {
    const list = cand[kind].sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    const [lo, hi] = DEPOSIT_COUNT[kind], want = lo + Math.floor(rng() * (hi - lo + 1));
    const chosen = [];
    for (const [, gi] of list) {
      if (chosen.length >= want) break;
      const gx = gi % TW, gy = (gi - gx) / TW;
      if (chosen.some(o => (o[0] - gx) * (o[0] - gx) + (o[1] - gy) * (o[1] - gy) < 9 * 9)) continue;
      chosen.push([gx, gy]);
      let rs = rng(), size = 0; for (let k = 0; k < SIZE.length; k++) { rs -= SIZE[k][1]; if (rs <= 0) { size = k; break; } }
      const x = Math.round(gx * TS + rng() * TS), y = Math.round(gy * TS + rng() * TS);
      if (!type[y * W + x]) continue;
      deposits.push({ kind, x, y, size, grade: Math.round((0.3 + 0.7 * rng()) * 100) / 100,
        depth: rng() < 0.35 ? 'surface' : rng() < 0.6 ? 'shallow' : 'deep', placer: false });
    }
  }
  // 砂金・砂錫：金・錫の鉱床の下流の川の砂に集まる
  if (hydro.riverPts) {
    const P = hydro.riverPts;
    for (const d of deposits.filter(d => d.kind === 'gold' || d.kind === 'tin')) {
      if (rng() > 0.5) continue;
      let best = -1, bd = 60 * 60;
      for (let k = 0; k < P.length; k += 9) { const dx = P[k] - d.x, dy = P[k + 1] - d.y, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = k; } }
      if (best < 0) continue;
      // 川を下流へ少し下った所（点の並びは上流→下流とは限らないので、低い方を選ぶ）
      const k2 = Math.min(P.length - 3, best + 3 * Math.round(10 + rng() * 30));
      const x = Math.round(P[k2]), y = Math.round(P[k2 + 1]);
      if (type[y * W + x] && elev[y * W + x] < elev[d.y * W + d.x]) deposits.push({ kind: d.kind, x, y, size: 0, grade: 0.5, depth: 'surface', placer: true });
    }
  }

  // ---- 漁場（気候格子のセルごと、年に獲れる量の目安 t）：川・湖の魚、沿岸の魚
  const fishFresh = new Float32Array(CLN), fishSea = new Float32Array(CLN);
  const areaKm2 = (CLIMATE_STEP * KM_PER_BLOCK) ** 2, blockKm2 = KM_PER_BLOCK * KM_PER_BLOCK;
  const featBonus = new Float32Array(CLN);
  for (const f of ter.featuresForResources || []) {
    const c = Math.min(CLH - 1, (f.y / CLIMATE_STEP) | 0) * CLW + Math.min(CLW - 1, (f.x / CLIMATE_STEP) | 0);
    const k = f.kind === 'bank' ? 2.5 : f.kind === 'reef' ? 1.8 : f.kind === 'delta' ? 1.6 : 0;
    if (!k) continue;
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const cc = c + dy * CLW + dx; if (cc >= 0 && cc < CLN) featBonus[cc] = Math.max(featBonus[cc], k); }
  }
  for (let cy = 0; cy < CLH; cy++) for (let cx = 0; cx < CLW; cx++) {
    const c = cy * CLW + cx;
    let fresh = 0, shelf = 0, landN = 0;
    for (let dy = 0; dy < CLIMATE_STEP; dy += 2) for (let dx = 0; dx < CLIMATE_STEP; dx += 2) {
      const i = (cy * CLIMATE_STEP + dy) * W + cx * CLIMATE_STEP + dx;
      if (water[i]) fresh += hydro.lakeId[i] ? 1 : 0.15;   // 川は地図の上では実際より太く描いているので、面積を小さく数える
      if (type[i]) landN++;
      else if (elev[i] > -250) shelf++;
    }
    const T = cl.tAnnual[c] / 10;
    // 淡水：水温が高いほど多い（凍る地域は少ない）。t/km²/年 の目安 ×面積
    fishFresh[c] = fresh * 4 * blockKm2 * 1.2 * smoothstep(-6, 14, T);
    // 沿岸：大陸棚の浅い海。寒流・湧昇域（海流の影響が冷たい所）・中高緯度・浅瀬・サンゴ礁・河口で多い
    const cold = Math.max(0, -cl.currentEffect[c] / 4);
    const lat = Math.abs(cl.latRow[cy]);
    fishSea[c] = shelf * 4 * blockKm2 * (3 + 1.2 * cold + 1.2 * smoothstep(25, 55, lat) + featBonus[c]) * (landN ? 1 : 0.7);
  }

  // ---- 家畜化・栽培化できる野生の動植物：適した気候の所のうち、ひと握りの地域にだけいる
  const wildMask = new Uint32Array(CLN), wildInfo = [];
  WILD_SPECIES.forEach((sp, bit) => {
    const suit = new Float32Array(CLN);
    const zoneSet = new Set(sp.zones);
    for (let cy = 0; cy < CLH; cy++) for (let cx = 0; cx < CLW; cx++) {
      const c = cy * CLW + cx, z = cl.zone[c];
      if (!z || !zoneSet.has(z)) continue;
      const x = cx * CLIMATE_STEP + 4, y = cy * CLIMATE_STEP + 4, i = y * W + x;
      if (!type[i]) continue;
      const e = Math.max(0, elev[i]), T = cl.tAnnual[c] / 10, P = cl.pAnnual[c];
      let s = smoothstep(sp.T[0] - 3, sp.T[0] + 1, T) * (1 - smoothstep(sp.T[1] - 1, sp.T[1] + 3, T))
        * smoothstep(sp.P[0] * 0.8, sp.P[0] * 1.1, P) * (1 - smoothstep(sp.P[1] * 0.9, sp.P[1] * 1.25, P));
      if (sp.elev) s *= smoothstep(sp.elev[0] - 300, sp.elev[0] + 200, e) * (1 - smoothstep(sp.elev[1] - 200, sp.elev[1] + 300, e));
      if (sp.tropicalLat) s *= 1 - smoothstep(sp.tropicalLat - 4, sp.tropicalLat + 4, Math.abs(cl.latRow[cy]));
      const b = biome[i];
      if (sp.forest) s *= [4, 6, 7, 10, 11].includes(b) ? 1 : 0.4;
      if (sp.grass) s *= [5, 9].includes(b) ? 1 : 0.35;
      if (sp.wet) s *= Math.max(0.35, Math.min(1, (b === B.WETLAND ? 1 : 0) + (hydro.water[i] ? 0.8 : 0) + smoothstep(1500, 2500, P)));
      if (sp.hills || sp.rugged) { const rel = Math.abs(elev[Math.min(N - 1, i + 6)] - elev[Math.max(0, i - 6)]) + Math.abs(elev[Math.min(N - 1, i + 6 * W)] - elev[Math.max(0, i - 6 * W)]); s *= sp.rugged ? 0.3 + 0.7 * smoothstep(60, 350, rel) : 0.5 + 0.5 * smoothstep(60, 300, rel); }
      suit[c] = s;
    }
    // 生息地のまとまり：適性の高い所からいくつか選び、まわりの適した所へ広げる
    const centers = [], np = sp.patches[0] + Math.floor(rng() * (sp.patches[1] - sp.patches[0] + 1));
    const cands = [];
    for (let c = 0; c < CLN; c++) if (suit[c] > 0.55) cands.push(c);
    for (let k = 0; k < np && cands.length; k++) {
      for (let t = 0; t < 40; t++) {
        const c = cands[Math.floor(rng() * cands.length)], x = c % CLW, y = (c - x) / CLW;
        if (centers.some(o => (o[0] - x) * (o[0] - x) + (o[1] - y) * (o[1] - y) < 40 * 40)) continue;
        centers.push([x, y, c]); break;
      }
    }
    let cells = 0;
    for (const [, , c0] of centers) {
      const size = 60 + Math.floor(rng() * 340), seen = new Set([c0]), queue = [c0];
      let h = 0;
      while (h < queue.length && h < size) {
        const c = queue[h++];
        wildMask[c] |= 1 << bit; cells++;
        const x = c % CLW;
        for (const d of [1, -1, CLW, -CLW]) {
          const j = c + d;
          if (j < 0 || j >= CLN || (d === 1 && x === CLW - 1) || (d === -1 && x === 0) || seen.has(j)) continue;
          if (suit[j] > 0.3) { seen.add(j); queue.push(j); }
        }
      }
    }
    wildInfo.push({ id: sp.id, name: sp.name, kind: sp.kind, use: sp.use, bit, patches: centers.length, cells,
      centers: centers.map(([x, y]) => ({ x: x * CLIMATE_STEP + 4, y: y * CLIMATE_STEP + 4 })) });
  });
  return {
    grid: { step: LR, w: LW, h: LH, soil, fertility: fert, gwDepth, gwRecharge, gwSaline, wood, stone, clay },
    cell: { step: CLIMATE_STEP, w: CLW, h: CLH, fishFresh, fishSea, wildMask },
    deposits, wild: wildInfo, meanFertility: fertN ? fertSum / fertN : 0,
  };
}

// ================================================================ メイン
function generateWorld(seed, report) {
  const t0 = Date.now();
  const timings = [];
  const progress = (stage) => { timings.push([stage, Date.now() - t0]); report(stage); };

  const tec = simulateTectonics(seed, progress);
  const ter = buildLandform(seed, tec, progress);
  ensureArchipelagos(seed, tec, ter, progress);
  const lmGeo = generateLandmarksGeo(seed, tec, ter, progress);
  const { elev, type, regionId } = ter;
  // 山脈のID（全解像度）
  const mr = countMountainRanges(tec);
  const mtnId = new Uint8Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (type[i] && elev[i] > 800) mtnId[i] = mr.mtnIdGeo[geoIndexAt(x, y)];
  }
  const clim = generateClimate(seed, type, elev, progress);
  const lmClim = generateLandmarksClim(seed, ter, clim, progress);
  const hydro = generateHydrology(seed, type, regionId, elev, clim.biome, clim, progress);
  const lmPost = generateLandmarksPost(seed, tec, ter, clim, hydro, lmClim.karst, progress);
  // 地形の特徴：{ kind, x, y }（kind の名前は FEATURE_KIND）
  const features = lmGeo.concat(lmClim.feats, hydro.landmarks, lmPost);
  const featureCounts = {};
  for (const f of features) featureCounts[f.kind] = (featureCounts[f.kind] || 0) + 1;
  const seas = generateSeaRegions(type, progress);
  const fauna = generateFauna(seed, type, elev, clim.biome, hydro, clim.data, progress);
  ter.featuresForResources = features;
  const resources = generateResources(seed, tec, ter, clim, hydro, lmClim.karst, progress);
  delete ter.featuresForResources;
  const biomeArea = new Array(BIOME_COUNT).fill(0);
  for (let i = 0; i < N; i++) if (type[i]) biomeArea[clim.biome[i]]++;

  let contCells = 0, islCells = 0;
  for (let i = 0; i < N; i++) { if (type[i] === 1) contCells++; else if (type[i] >= 2) islCells++; }
  const continents = ter.contAreas.length - 1;
  return {
    elev, type, regionId, mtnId, seaId: seas.seaId, biome: clim.biome,
    // 火山：{ x, y（ブロック）, kind（0 成層火山 / 1 盾状火山）, active（活火山）, height（火山体の高さ m）, radius（ブロック）, summit（山頂の標高 m） }
    volcanoes: ter.volcanoes, features, lakeSalt: hydro.lakeSalt,
    // 自然の資源：grid（粗いグリッド LR）＝土・肥えぐあい・地下水・木材・石材・粘土、cell（気候格子）＝漁場・野生の動植物、deposits＝鉱床
    resources,
    // 動物：env（気候格子ごとの環境）、species[種].suit/tier（生息適性・3段階）/pops（個体群）
    fauna,
    water: hydro.water, lakeId: hydro.lakeId, lakeLevels: hydro.lakeLevels, riverPts: hydro.riverPts, riverStarts: hydro.riverStarts,
    riverLine: hydro.riverLine, riverInfo: hydro.riverInfo,
    climate: { tempSea: clim.tempSea, precip: clim.precip, gridStep: LR, gridW: LW, gridH: LH, latTop: LAT_TOP, latBottom: LAT_BOTTOM,
      // 気候システムの保存データ（気候格子 CLW×CLH、1セル = CLIMATE_STEP ブロック四方。形式は各配列のコメント参照）
      cell: { gridStep: CLIMATE_STEP, gridW: CLW, gridH: CLH, ...clim.data } },
    // 地質情報（地質格子 TW×TH、1セル = TS×TS ブロック）
    geology: {
      gridStep: TS, gridW: TW, gridH: TH, kmPerBlock: KM_PER_BLOCK, timeMyr: GEO_TIME_MYR,
      plate: tec.plate, crust: tec.crust, thickness: tec.thick, density: tec.density, age: tec.age,
      boundaryType: tec.btype, boundaryRate: tec.brate, boundaryDist: tec.bdist, fault: tec.fault,
      orogeny: tec.oro, orogenyAge: tec.oroAge, volcanism: tec.volcHist, cause: tec.cause,
      plates: tec.plates, hotspots: tec.hotspots,
    },
    stats: {
      version: volcanoGenerationVersion,
      width: W, height: H,
      plates: tec.plates.length,
      hotspots: tec.hotspots.length,
      tectonicEvents: tec.stats,
      continents,
      archipelagos: ter.archs.length,
      volcanoes: ter.volcanoes.length,
      features: featureCounts,
      deposits: resources.deposits.reduce((a, d) => (a[d.kind] = (a[d.kind] || 0) + 1, a), {}),
      wildSpecies: resources.wild.filter(w => w.cells > 0).length, rias: hydro.rias, canyons: hydro.canyons, waterfalls: hydro.waterfalls,
      activeVolcanoes: ter.volcanoes.filter(v => v.active).length,
      archipelagoIslands: ter.archs.map(a => a.islands),
      archipelagoOrigins: ter.archs.map(a => a.origin),
      mountains: mr.count,
      rivers: hydro.riverCount,
      lakes: hydro.lakeCount,
      fjords: hydro.fjords,
      estuaries: hydro.estuaries,
      deltas: hydro.deltas,
      landCells: contCells + islCells,
      landRatio: (contCells + islCells) / N,
      continentRatio: contCells / N,
      islandRatio: islCells / N,
      seaRegions: seas.count,
      mainOceanShare: seas.mainShare,
      islands: countIslands(type, regionId),
      biomeArea,
      ms: Date.now() - t0,
      timings,
    },
  };
}

self.onmessage = function (e) {
  const { id, seed, genVersion } = e.data;
  volcanoGenerationVersion = genVersion === 11 ? 11 : 12;
  try {
    const w = generateWorld(seed >>> 0, (stage) => self.postMessage({ id, kind: 'progress', stage }));
    self.postMessage({ id, kind: 'done', elev: w.elev, type: w.type, regionId: w.regionId, mtnId: w.mtnId, seaId: w.seaId,
      biome: w.biome, climate: w.climate, water: w.water, lakeId: w.lakeId, lakeLevels: w.lakeLevels,
      riverPts: w.riverPts, riverStarts: w.riverStarts, geology: w.geology, volcanoes: w.volcanoes, features: w.features, lakeSalt: w.lakeSalt, fauna: w.fauna,
      riverLine: w.riverLine, riverInfo: w.riverInfo, resources: w.resources, stats: w.stats },
      [w.elev.buffer, w.type.buffer, w.regionId.buffer, w.mtnId.buffer, w.seaId.buffer, w.biome.buffer,
       w.water.buffer, w.lakeId.buffer, w.lakeLevels.buffer, w.riverPts.buffer, w.riverStarts.buffer,
       w.climate.tempSea.buffer, w.climate.precip.buffer,
       // 気候の保存データ（月別の配列など）。同じバッファを2回渡すとエラーになるので重複を除く
       ...new Set(Object.values(w.climate.cell).filter(v => ArrayBuffer.isView(v)).map(v => v.buffer))]);
    // 地質格子は小さい（375×375）のでコピーで渡す
  } catch (err) {
    self.postMessage({ id, kind: 'error', message: String(err && err.stack || err) });
  }
};
</script>

// ------------------------------------------------------------ 河川（地形メッシュの面に沿ったリボン）

const cam = { tx: 0, tz: 0, dist: 3900, yaw: 0, pitch: 0.95 };
const CAM_LIMITS = { minDist: 60, maxDist: 6600, minPitch: 0.18, maxPitch: 1.52 };
function resetCamera() {
  cam.tx = 0; cam.tz = 180; cam.dist = window.innerWidth / window.innerHeight > 1.6 ? 3450 : 4350;
  cam.yaw = 0; cam.pitch = 0.95;
  updateCamera();
}
function updateCamera() {
  cam.dist = Math.min(CAM_LIMITS.maxDist, Math.max(CAM_LIMITS.minDist, cam.dist));
  cam.pitch = Math.min(CAM_LIMITS.maxPitch, Math.max(CAM_LIMITS.minPitch, cam.pitch));
  cam.tx = Math.min(W / 2, Math.max(-W / 2, cam.tx));
  cam.tz = Math.min(H / 2, Math.max(-H / 2, cam.tz));
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  camera.position.set(
    cam.tx + cam.dist * cp * Math.sin(cam.yaw),
    cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.yaw));
  camera.lookAt(cam.tx, 0, cam.tz);
  requestRender();
}

// ------------------------------------------------------------ タッチ操作
// 左半分：1本指で地図を移動 / 右半分：1本指で視点を回転 / 2本指：ピンチでズーム
const touches = new Map(); // identifier → { x, y, role }
let pinchDist = 0;
function twoTouches() {
  const it = touches.values();
  return [it.next().value, it.next().value];
}
function pinchDistance() {
  const [a, b] = twoTouches();
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}
const canvas = renderer.domElement;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    touches.set(t.identifier, { x: t.clientX, y: t.clientY, x0: t.clientX, y0: t.clientY, t0: Date.now(), multi: e.touches.length > 1, role: t.clientX < window.innerWidth / 2 ? 'pan' : 'rotate' });
  }
  if (touches.size >= 2) { for(const t of touches.values())t.multi=true; pinchDist = pinchDistance(); }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const prev = new Map();
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier);
    if (!s) continue;
    prev.set(t.identifier, { x: s.x, y: s.y });
    s.x = t.clientX; s.y = t.clientY;
  }
  if (touches.size >= 2) {
    const d = pinchDistance();
    if (pinchDist > 0 && d > 0) { cam.dist *= pinchDist / d; updateCamera(); }
    pinchDist = d;
    return;
  }
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier), p = prev.get(t.identifier);
    if (!s || !p) continue;
    const dx = s.x - p.x, dy = s.y - p.y;
    if (s.role === 'pan') {
      // 画面の上下 → Z方向、左右 → X方向（視点の向きに合わせて回転）
      const k = cam.dist * 1.25 / window.innerHeight;
      const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
      cam.tx += (-dx * cy - dy * sy) * k;
      cam.tz += (dx * sy - dy * cy) * k;
    } else {
      cam.yaw -= dx * 0.006;
      cam.pitch += dy * 0.005;
    }
    updateCamera();
  }
}, { passive: false });
function endTouches(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier);
    // 指をほとんど動かさずに長押しして離した：その位置の地名を改名する（普通のタップでは開かない）
    if (s && !s.multi && e.type === 'touchend' && touches.size === 1 && Math.abs(t.clientX-s.x0)+Math.abs(t.clientY-s.y0)<12) {
      const id=volcanoAtScreen(t.clientX,t.clientY);
      if(Date.now()-s.t0>=LABEL_HOLD_MS) { if(!labelTap(t.clientX,t.clientY) && id>=0)renameOpen(names.byKey.get('volcano:'+id)); }
      else if(id>=0)openVolcano(id);
    }
    touches.delete(t.identifier);
  }
  pinchDist = touches.size >= 2 ? pinchDistance() : 0;
}
canvas.addEventListener('touchend', endTouches, { passive: false });
canvas.addEventListener('touchcancel', endTouches, { passive: false });

// Seed文字列 → 32bit整数。数字ならその値、それ以外は文字列のハッシュ
function seedToInt(str) {
  const s = String(str).trim();
  if (/^\d{1,10}$/.test(s) && Number(s) <= 4294967295) return Number(s) >>> 0;
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}

    if (m.kind === 'progress') { loadingText.textContent = '世界を生成中…（' + m.stage + '）'; return; }
    if (m.kind === 'error') {
      busy = false; setButtons(); loading.classList.remove('show');
      showError('生成エラー: ' + m.message);
      return;
    }
    // 履歴は直前の1つだけ（Seedのみ保持し、戻るときは同じSeedから再生成する）
    previousSeed = currentSeed;
    currentSeed = seedStr;
    world = { elev: m.elev, type: m.type, regionId: m.regionId, mtnId: m.mtnId, seaId: m.seaId, biome: m.biome, climate: m.climate,
      water: m.water, lakeId: m.lakeId, lakeLevels: m.lakeLevels, riverPts: m.riverPts, riverStarts: m.riverStarts,

    lakeId = m.lakeId; lakeLevels = m.lakeLevels;
